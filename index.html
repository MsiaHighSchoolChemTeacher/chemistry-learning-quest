<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>元素风暴：最终重制版</title>
    <style>
        /* ==========================================================================
           1. 视觉升级层 (UI Adjustments) - 纯 CSS 调整，不改动 HTML 结构
           ========================================================================== */
        :root {
            --primary: #6c5ce7; 
            --accent: #a29bfe;
            --success: #00b894; 
            --error: #d63031; 
            --bg-grad: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --glass: rgba(255, 255, 255, 0.9);
            --glass-dark: rgba(20, 20, 20, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-grad);
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
            transition: background 1s;
        }

        /* 3A 特效：Boss模式背景变黑 */
        body.boss-mode { background: radial-gradient(circle, #2d3436 0%, #000000 100%); }
        body.boss-mode .game-card { box-shadow: 0 0 50px rgba(214, 48, 49, 0.5); border: 1px solid var(--error); }

        /* 3A 特效：粒子层 */
        #vfx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 999; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; animation: boom 0.6s ease-out forwards; }
        @keyframes boom { 0% { transform: scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }

        /* 3A 特效：震动 */
        .shake { animation: shakeAnim 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeAnim { 
            10%, 90% { transform: translate3d(-2px, 0, 0); } 
            20%, 80% { transform: translate3d(4px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 
            40%, 60% { transform: translate3d(6px, 0, 0); } 
        }

        /* HUD 仪表盘 (保留布局，优化质感) */
        .hud-container {
            position: absolute; top: 0; left: 0; right: 0; height: 80px;
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none; /* 让点击穿透 */
        }
        .hud-box {
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 5px 15px; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center;
            font-size: 12px; font-weight: bold; color: #555; pointer-events: auto;
        }
        .hud-val { font-size: 18px; color: var(--primary); margin-top: 2px; }

        /* 游戏主卡片 (保留布局，优化质感) */
        .main-container {
            flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; z-index: 5;
        }
        .game-card {
            background: var(--glass); width: 92%; max-width: 480px;
            padding: 25px; border-radius: 24px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transition: all 0.3s; position: relative;
        }
        /* 答对弹跳 */
        .game-card.pop { animation: popScale 0.3s; }
        @keyframes popScale { 50% { transform: scale(1.05); } }

        .q-tag { background: #dfe6e9; color: #636e72; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .q-text { font-size: 52px; font-weight: 900; color: #2d3436; margin: 15px 0; min-height: 70px; }
        
        /* PDF需求：Hint 样式 */
        .q-hint { 
            font-size: 13px; color: var(--error); font-weight: bold; height: 20px; 
            margin-bottom: 5px; opacity: 1; transition: opacity 0.3s; 
        }

        .input-display {
            background: #f1f2f6; height: 60px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; color: #2d3436; font-family: monospace;
            border: 3px solid transparent; transition: all 0.2s;
        }
        .input-display.active { background: white; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.2); }
        .cursor { width: 3px; height: 32px; background: var(--primary); margin-left: 5px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 虚拟键盘 (保留布局，优化按键质感) */
        .virtual-keyboard {
            width: 100%; max-width: 800px;
            background: rgba(255,255,255,0.95); border-radius: 24px 24px 0 0;
            padding: 10px 5px 25px 5px; position: relative; z-index: 20;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        }
        .kb-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 6px; }
        .key {
            flex: 1; height: 48px; max-width: 52px;
            background: #fff; border-radius: 10px; border-bottom: 3px solid #b2bec3;
            display: flex; align-items: center; justify-content: center;
            font-size: 19px; font-weight: 700; color: #2d3436;
            cursor: pointer; transition: all 0.05s;
        }
        .key:active { transform: translateY(3px); border-bottom-width: 0; background: #f0f0f0; }
        
        .key.chem { background: #e3f2fd; color: #0984e3; border-bottom-color: #74b9ff; font-size: 16px; }
        .key.enter { flex: 2; max-width: 120px; background: var(--success); color: white; border-bottom-color: #009476; }
        .key.del { background: var(--error); color: white; border-bottom-color: #c0392b; }
        .key.shift { background: #ffeaa7; color: #d35400; border-bottom-color: #fdcb6e; }
        .key.shift.active { background: #fdcb6e; color: white; transform: translateY(3px); border-bottom-width: 0; }

        /* 遮罩层 (原版 Feedback & Menu) */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        
        .menu-card {
            background: white; width: 85%; max-width: 380px; padding: 40px; 
            border-radius: 24px; text-align: center;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .btn-start {
            background: var(--primary); color: white; border: none;
            padding: 15px 50px; font-size: 20px; border-radius: 50px; font-weight: bold;
            cursor: pointer; box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4); margin-top: 20px;
            width: 100%; transition: transform 0.1s;
        }
        .btn-start:active { transform: scale(0.95); }

        /* 错题反馈样式 */
        .correction-box {
            background: #fff5f5; border-left: 5px solid var(--error);
            padding: 15px; margin-bottom: 20px; text-align: left;
        }
        .cr-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; color: #636e72; }
        .cr-val { font-family: monospace; font-size: 18px; font-weight: bold; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="vfx-layer"></div>

    <div class="overlay active" id="menuOverlay">
        <div class="menu-card">
            <h1 style="color:var(--primary); font-size:36px; margin-bottom:15px">元素风暴</h1>
            <p style="color:#636e72; line-height:1.6; margin-bottom:30px">
                欢迎来到化学试炼场。<br>这是一场关于记忆与反应的战争。<br>准备好开始了吗？
            </p>
            <button class="btn-start" onclick="Game.start()">开始挑战</button>
        </div>
    </div>

    <div class="hud-container hidden" id="hudArea">
        <div class="hud-box">
            <span style="opacity:0.7">关卡</span>
            <span class="hud-val" id="hud-stage">S1</span>
        </div>
        <div class="hud-box" style="flex:1; margin:0 15px">
            <span style="opacity:0.7">进度</span>
            <span class="hud-val" id="hud-prog">0 / 8</span>
        </div>
        <div class="hud-box">
            <span style="opacity:0.7">得分</span>
            <span class="hud-val" style="color:var(--success)" id="hud-score">0</span>
        </div>
    </div>

    <div class="main-container hidden" id="playArea">
        <div class="game-card" id="gameCard">
            <span class="q-tag" id="q-tag">题目</span>
            <div class="q-text" id="q-text">Loading...</div>
            
            <div class="q-hint" id="q-hint">提示信息</div>

            <div class="input-display" id="inputBox">
                <span id="inputAns"></span><div class="cursor"></div>
            </div>
        </div>
    </div>

    <div class="virtual-keyboard hidden" id="kbArea">
        <div class="kb-row">
            <div class="key chem" onclick="KB.tap('⁺')">⁺</div>
            <div class="key chem" onclick="KB.tap('⁻')">⁻</div>
            <div class="key chem" onclick="KB.tap('²')">²</div>
            <div class="key chem" onclick="KB.tap('³')">³</div>
            <div class="key chem" onclick="KB.tap('(')">(</div> <div class="key chem" onclick="KB.tap(')')">)</div> </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('Q')">Q</div><div class="key" onclick="KB.tap('W')">W</div>
            <div class="key" onclick="KB.tap('E')">E</div><div class="key" onclick="KB.tap('R')">R</div>
            <div class="key" onclick="KB.tap('T')">T</div><div class="key" onclick="KB.tap('Y')">Y</div>
            <div class="key" onclick="KB.tap('U')">U</div><div class="key" onclick="KB.tap('I')">I</div>
            <div class="key" onclick="KB.tap('O')">O</div><div class="key" onclick="KB.tap('P')">P</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('A')">A</div><div class="key" onclick="KB.tap('S')">S</div>
            <div class="key" onclick="KB.tap('D')">D</div><div class="key" onclick="KB.tap('F')">F</div>
            <div class="key" onclick="KB.tap('G')">G</div><div class="key" onclick="KB.tap('H')">H</div>
            <div class="key" onclick="KB.tap('J')">J</div><div class="key" onclick="KB.tap('K')">K</div>
            <div class="key" onclick="KB.tap('L')">L</div>
        </div>
        <div class="kb-row">
            <div class="key shift" id="btnShift" onclick="KB.toggleShift()">⬆</div>
            <div class="key" onclick="KB.tap('Z')">Z</div><div class="key" onclick="KB.tap('X')">X</div>
            <div class="key" onclick="KB.tap('C')">C</div><div class="key" onclick="KB.tap('V')">V</div>
            <div class="key" onclick="KB.tap('B')">B</div><div class="key" onclick="KB.tap('N')">N</div>
            <div class="key" onclick="KB.tap('M')">M</div>
            <div class="key del" onclick="KB.del()">⌫</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('1')">1</div><div class="key" onclick="KB.tap('2')">2</div>
            <div class="key" onclick="KB.tap('3')">3</div><div class="key" onclick="KB.tap('4')">4</div>
            <div class="key enter" onclick="Game.check()">提交</div>
        </div>
    </div>

    <div class="overlay" id="feedbackOverlay">
        <div class="menu-card">
            <h2 id="fbTitle" style="color:var(--error); margin-bottom:15px">答错了</h2>
            
            <div class="correction-box" id="fbContent">
                </div>
            
            <button class="btn-start" id="fbBtn" onclick="Game.hideFeedback()">继续</button>
        </div>
    </div>

<script>
/* ================= 题库数据 (The Soul) ================= */
const DATA = {
    s1: [ 
        {q:"氢", a:"H"}, {q:"氦", a:"He"}, {q:"碳", a:"C"}, {q:"氮", a:"N"}, {q:"氧", a:"O"},
        {q:"氟", a:"F"}, {q:"氖", a:"Ne"}, {q:"钠", a:"Na"}, {q:"镁", a:"Mg"}, {q:"铝", a:"Al"},
        {q:"硅", a:"Si"}, {q:"磷", a:"P"}, {q:"硫", a:"S"}, {q:"氯", a:"Cl"}, {q:"钾", a:"K"}, 
        {q:"钙", a:"Ca"}, {q:"锰", a:"Mn"}, {q:"铁", a:"Fe"}, {q:"铜", a:"Cu"}, {q:"银", a:"Ag"}
    ],
    s2: [ 
        {q:"氢离子", a:"H⁺"}, {q:"钠离子", a:"Na⁺"}, {q:"镁离子", a:"Mg²⁺"}, {q:"铝离子", a:"Al³⁺"},
        {q:"钾离子", a:"K⁺"}, {q:"钙离子", a:"Ca²⁺"}, {q:"铁离子", a:"Fe³⁺"}, {q:"亚铁离子", a:"Fe²⁺"},
        {q:"铜离子", a:"Cu²⁺"}, {q:"银离子", a:"Ag⁺"}, {q:"铵根", a:"NH4⁺"}, 
        {q:"氢氧根", a:"OH⁻"}, {q:"硝酸根", a:"NO3⁻"}, {q:"硫酸根", a:"SO4²⁻"}, {q:"碳酸根", a:"CO3²⁻"}
    ],
    s3: [
        {q:"水", a:"H2O"}, {q:"二氧化碳", a:"CO2"}, {q:"氯化钠", a:"NaCl"}, {q:"氧化镁", a:"MgO"},
        {q:"五氧化二磷", a:"P2O5"}, {q:"四氧化三铁", a:"Fe3O4"}, {q:"氯酸钾", a:"KClO3"},
        {q:"硫酸铜", a:"CuSO4"}, {q:"碳酸钙", a:"CaCO3"}, {q:"氢氧化钙", a:"Ca(OH)2"},
        {q:"硫酸铝", a:"Al2(SO4)3"}
    ]
};

/* ================= 关卡配置 (PDF需求) ================= */
const LEVELS = [
    { id: 's1', name: 'S1 元素觉醒', target: 8, hint: "提示：注意大小写，首字母大写 (如 Na)", type: 'normal' },
    { id: 's2', name: 'S2 离子风暴', target: 8, hint: "提示：记得带电荷，键盘第一排符号 (如 Na⁺)", type: 'normal' },
    { id: 's3', name: 'S3 物质构建', target: 8, hint: "提示：原子团若有角标需加括号，如 Ca(OH)₂", type: 'normal' },
    { id: 'boss', name: 'BOSS 混沌试炼', target: 99, hp: 5, hint: "警告：全类型混合攻击！", type: 'boss' }
];

/* ================= 游戏引擎 (原版逻辑恢复) ================= */
const Game = {
    lvlIdx: 0,
    qIdx: 0,
    score: 0,
    currQ: null,
    bossHp: 0,
    state: 'menu',

    // 1. 启动游戏
    start() {
        document.getElementById('menuOverlay').classList.remove('active');
        document.getElementById('hudArea').classList.remove('hidden');
        document.getElementById('playArea').classList.remove('hidden');
        document.getElementById('kbArea').classList.remove('hidden');
        
        this.lvlIdx = 0;
        this.score = 0;
        this.startLevel();
    },

    // 2. 关卡初始化
    startLevel() {
        const lvl = LEVELS[this.lvlIdx];
        this.qIdx = 0;
        
        // 3A 特效：Boss模式切换
        if (lvl.type === 'boss') {
            document.body.classList.add('boss-mode');
            this.bossHp = lvl.hp;
        } else {
            document.body.classList.remove('boss-mode');
        }

        document.getElementById('hud-stage').innerText = lvl.name.split(' ')[0];
        this.nextQuestion();
    },

    // 3. 出题逻辑 (无缝切换核心)
    nextQuestion() {
        const lvl = LEVELS[this.lvlIdx];
        
        // 判定过关
        let isPass = (lvl.type === 'boss') ? (this.bossHp <= 0) : (this.qIdx >= lvl.target);
        if (isPass) {
            if (this.lvlIdx < LEVELS.length - 1) {
                // PDF P1: 无缝进入下一关，不弹窗
                this.lvlIdx++;
                this.startLevel();
            } else {
                this.showMenu("传说达成！", "恭喜你，化学骑士！<br>你已征服所有元素！", "再来一次", true);
            }
            return;
        }

        // 随机出题
        let pool = [];
        if (lvl.type === 'boss') {
            pool = [...DATA.s1, ...DATA.s2, ...DATA.s3];
        } else {
            pool = DATA[lvl.id];
        }
        this.currQ = pool[Math.floor(Math.random() * pool.length)];

        // 更新 UI
        document.getElementById('q-tag').innerText = lvl.name;
        document.getElementById('q-text').innerText = this.currQ.q;
        
        let progText = (lvl.type === 'boss') ? ("BOSS: " + this.bossHp) : (this.qIdx + " / " + lvl.target);
        document.getElementById('hud-prog').innerText = progText;
        document.getElementById('hud-score').innerText = this.score;
        
        document.getElementById('inputAns').innerText = "";
        KB.reset();

        // PDF P2: 智能提示 (仅第1题显示)
        const hintEl = document.getElementById('q-hint');
        if (this.qIdx === 0) {
            hintEl.innerText = lvl.hint;
            hintEl.style.opacity = 1;
        } else {
            hintEl.style.opacity = 0;
        }
        
        this.state = 'playing';
    },

    // 4. 判题逻辑
    check() {
        if (this.state !== 'playing') return;
        const input = document.getElementById('inputAns').innerText;
        if (!input) return;

        if (input === this.currQ.a) {
            // === 答对：3A爽感特效 ===
            this.score += 10;
            const lvl = LEVELS[this.lvlIdx];
            if (lvl.type === 'boss') this.bossHp--;
            else this.qIdx++;

            // 粒子爆炸
            VFX.boom();
            // 卡片弹跳
            const card = document.getElementById('gameCard');
            card.classList.remove('pop');
            void card.offsetWidth;
            card.classList.add('pop');

            setTimeout(() => this.nextQuestion(), 500);
        } else {
            // === 答错：原版反馈遮罩 ===
            // 屏幕震动
            const card = document.getElementById('gameCard');
            card.classList.add('shake');
            setTimeout(()=>card.classList.remove('shake'), 400);
            
            this.showFeedback(input);
        }
    },

    // 5. 显示反馈 (恢复原版逻辑)
    showFeedback(wrongInput) {
        const overlay = document.getElementById('feedbackOverlay');
        const content = document.getElementById('fbContent');
        const title = document.getElementById('fbTitle');
        const btn = document.getElementById('fbBtn');

        title.innerText = "答错了";
        title.style.color = "var(--error)";
        
        // 动态生成对比
        content.innerHTML = `
            <div class="cr-row">
                <span>你的答案</span>
                <span class="cr-val" style="color:var(--error); text-decoration:line-through">${wrongInput}</span>
            </div>
            <div class="cr-row">
                <span>正确答案</span>
                <span class="cr-val" style="color:var(--success)">${this.currQ.a}</span>
            </div>
        `;
        
        btn.onclick = () => Game.hideFeedback();
        overlay.classList.add('active');
        this.state = 'feedback';
    },

    hideFeedback() {
        document.getElementById('feedbackOverlay').classList.remove('active');
        this.nextQuestion(); // 答错后继续换题，避免卡关
    },

    // 6. 通用菜单 (用于胜利或重开)
    showMenu(title, desc, btnText, isWin) {
        document.getElementById('hudArea').classList.add('hidden');
        document.getElementById('playArea').classList.add('hidden');
        document.getElementById('kbArea').classList.add('hidden');
        
        const overlay = document.getElementById('menuOverlay');
        overlay.querySelector('h1').innerText = title;
        overlay.querySelector('h1').style.color = isWin ? "var(--success)" : "var(--primary)";
        overlay.querySelector('.modal-desc').innerHTML = desc;
        
        const btn = overlay.querySelector('button');
        btn.innerText = btnText;
        btn.onclick = () => Game.start(); // 重开
        
        overlay.classList.add('active');
        this.state = 'menu';
    }
};

/* ================= 视觉特效库 (新增) ================= */
const VFX = {
    boom() {
        const box = document.getElementById('inputBox');
        const rect = box.getBoundingClientRect();
        const colors = ['#6c5ce7', '#00b894', '#fdcb6e'];
        
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
            const size = Math.random()*8 + 4;
            p.style.width = size+'px'; p.style.height = size+'px';
            p.style.left = (rect.left + rect.width/2) + 'px';
            p.style.top = (rect.top + rect.height/2) + 'px';
            
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 120 + 40;
            p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
            p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
            
            document.getElementById('vfx-layer').appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
    }
};

/* ================= 键盘控制器 (原版逻辑) ================= */
const KB = {
    isShift: true,
    tap(char) {
        let c = char;
        // 自动首字母大写
        if (/[a-z]/i.test(c) && c.length === 1) {
            c = this.isShift ? c.toUpperCase() : c.toLowerCase();
            if (this.isShift) this.toggleShift();
        }
        
        const box = document.getElementById('inputAns');
        box.innerText += c;
        
        // 按键反馈
        const wrap = document.getElementById('inputBox');
        wrap.classList.add('active');
        setTimeout(() => wrap.classList.remove('active'), 100);
    },
    del() {
        const box = document.getElementById('inputAns');
        box.innerText = box.innerText.slice(0, -1);
        if (box.innerText.length === 0) { this.isShift = true; this.render(); }
    },
    toggleShift() { this.isShift = !this.isShift; this.render(); },
    reset() { this.isShift = true; this.render(); },
    render() {
        const btn = document.getElementById('btnShift');
        if (this.isShift) btn.classList.add('active'); else btn.classList.remove('active');
        document.querySelectorAll('.key').forEach(k => {
            const t = k.innerText;
            if (t.length === 1 && /[a-z]/i.test(t)) {
                k.innerText = this.isShift ? t.toUpperCase() : t.toLowerCase();
            }
        });
    }
};

/* ================= 物理键盘监听 ================= */
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        if (Game.state === 'menu') Game.start();
        else if (Game.state === 'feedback') Game.hideFeedback();
        else if (Game.state === 'playing') Game.check();
    } else if (e.key === 'Backspace') {
        KB.del();
    } else if (e.key.length === 1) {
        KB.tap(e.key);
    }
});
</script>
</body>
