<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>元素风暴：化学骑士 (完整教学版)</title>
    <style>
        /* ================= 视觉层 ================= */
        :root {
            --primary: #4834d4; 
            --accent: #686de0;
            --success: #6ab04c; 
            --error: #eb4d4b; 
            --bg-grad: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-grad);
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* 3A 特效层 */
        #vfx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 99; }
        .particle { position: absolute; border-radius: 50%; animation: boom 0.6s ease-out forwards; }
        @keyframes boom { 0% { transform: scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
        
        /* 震动特效 */
        .shake-anim { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        /* HUD */
        .hud-container {
            position: absolute; top: 0; left: 0; right: 0; height: 80px;
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .hud-box {
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 5px 15px; border-radius: 16px; pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center; min-width: 80px;
        }
        .score-val { color: var(--primary); font-size: 18px; font-weight: 900; }
        .lives { font-size: 18px; letter-spacing: 2px; }
        
        /* 进度条 */
        .progress-bar-container { width: 100%; height: 6px; background: #ddd; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--success); transition: width 0.3s; }

        /* 游戏卡片 */
        .game-card {
            background: var(--glass); width: 95%; max-width: 500px;
            padding: 20px 25px; border-radius: 24px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transition: transform 0.2s; position: relative; z-index: 5;
            /* 稍微上移，给键盘留空间 */
            margin-bottom: 220px; 
        }
        .game-card.pop { animation: popScale 0.3s; }
        @keyframes popScale { 50% { transform: scale(1.05); } }

        .q-tag { display: inline-block; background: #dfe6e9; color: #636e72; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        
        /* 题目显示区 */
        .q-display { 
            font-size: 42px; font-weight: 800; color: #2d3436; 
            min-height: 70px; display: flex; align-items: center; justify-content: center; 
            gap: 15px; margin: 5px 0 15px;
        }
        
        .ion-block { 
            padding: 5px 10px; background: #f1f2f6; border-radius: 8px; 
            border: 2px solid #dfe6e9; position: relative; font-family: monospace;
        }

        .text-hint { 
            font-size: 13px; color: var(--error); font-weight: bold; height: 20px; margin-top: 8px;
            opacity: 1; transition: opacity 0.3s; 
        }

        /* 输入区 */
        .input-area { position: relative; margin-top: 5px; }
        input {
            width: 100%; padding: 10px; font-size: 28px; 
            border: 3px solid transparent; border-radius: 15px;
            text-align: center; outline: none; background: #f1f2f6; 
            color: #2d3436; font-weight: bold; font-family: monospace;
            transition: all 0.3s;
        }
        input.active { background: #fff; border-color: var(--primary); }
        input.correct { border-color: var(--success); background: #e3fcef; }
        input.error { border-color: var(--error); background: #fff0f0; }

        /* === 键盘 (重构：增加下标区) === */
        .keyboard {
            width: 100%; max-width: 800px;
            background: rgba(255,255,255,0.98); border-radius: 24px 24px 0 0;
            padding: 8px 5px 25px 5px; position: absolute; bottom: 0; z-index: 20;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
        }
        .kb-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 5px; }
        .key {
            flex: 1; height: 42px; max-width: 48px;
            background: #fff; border-radius: 8px; border-bottom: 2px solid #b2bec3;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: #2d3436; cursor: pointer;
            transition: all 0.1s;
        }
        .key:active { transform: translateY(2px); border-bottom: none; background: #f0f0f0; }
        
        /* 特殊功能键颜色 */
        .sub { background: #dfe6e9; color: #636e72; font-size: 16px; border-bottom-color: #b2bec3; } /* 下标 */
        .sup { background: #e3f2fd; color: #0984e3; border-bottom-color: #74b9ff; font-size: 16px; } /* 上标 */
        .enter { flex: 2; max-width: 90px; background: var(--success); color: white; border-bottom-color: #4ba836; }
        .del { background: var(--error); color: white; border-bottom-color: #c0392b; }
        .shift { background: #ffeaa7; color: #d35400; border-bottom-color: #fdcb6e; }
        .shift.active { background: #fdcb6e; color: white; transform: translateY(2px); border-bottom: none; }

        /* 遮罩层 (通用) */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal { background: white; padding: 30px; border-radius: 24px; text-align: center; width: 85%; max-width: 360px; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .btn-main {
            background: var(--primary); color: white; border: none; padding: 12px 30px;
            border-radius: 50px; font-size: 18px; font-weight: bold; margin-top: 20px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(72,52,212,0.3); width: 100%;
        }

        /* 反馈遮罩 (保留原版) */
        .fb-detail { font-size: 15px; color: #636e72; margin: 15px 0; text-align: left; line-height: 1.6; }
        .math-expl { background: #f1f2f6; padding: 10px; border-radius: 8px; margin-top: 10px; font-family: monospace; color: #d63031; font-size: 13px; }

        .hidden { display: none !important; }
        sub, sup { font-size: 0.7em; }
    </style>
</head>
<body>

    <div id="vfx-layer"></div>

    <div class="hud-container hidden" id="hudArea">
        <div class="hud-box"><div class="lives" id="livesDisplay">❤❤❤</div></div>
        <div class="hud-box" style="flex:1; margin:0 15px">
            <div class="stage-badge" id="stageName">S1</div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="stageProgress"></div></div>
        </div>
        <div class="hud-box"><div class="score-val" id="scoreDisplay">0</div></div>
    </div>

    <div class="overlay active" id="menuOverlay">
        <div class="modal">
            <h1 style="color:var(--primary); margin-bottom:10px">元素风暴</h1>
            <p style="color:#666; margin-bottom:20px">化合价、离子、配平...<br>你准备好了吗？</p>
            <button class="btn-main" onclick="Game.start()">开始挑战</button>
        </div>
    </div>

    <div class="overlay" id="levelClearOverlay">
        <div class="modal">
            <h2 style="color:var(--success)">🎉 关卡完成!</h2>
            <div style="font-size:50px; margin:15px 0">⭐️⭐️⭐️</div>
            <p id="levelClearMsg" style="color:#666">完美通关！准备好进入下一阶段了吗？</p>
            <button class="btn-main" onclick="Game.nextStageAction()">进入下一关</button>
        </div>
    </div>

    <div class="game-card hidden" id="gameCard">
        <div class="q-tag" id="qTag">Type</div>
        <div class="q-display" id="qDisplay"></div>
        <div class="input-area"><input type="text" id="inputAns" readonly /></div>
        <div class="text-hint" id="hintText"></div>
    </div>
    
    <div class="overlay" id="feedbackOverlay">
        <div class="modal">
            <h2 style="color:var(--error)">回答错误</h2>
            <div class="fb-detail" id="fbDetail"></div>
            <button class="btn-main" onclick="UI.hideFeedback()">继续</button>
        </div>
    </div>

    <div class="keyboard hidden" id="kbArea">
        <div class="kb-row">
            <div class="key sup" onclick="KB.tap('⁺')">⁺</div>
            <div class="key sup" onclick="KB.tap('⁻')">⁻</div>
            <div class="key sup" onclick="KB.tap('²')">²</div>
            <div class="key sup" onclick="KB.tap('³')">³</div>
            <div class="key sup" onclick="KB.tap('(')">(</div>
            <div class="key sup" onclick="KB.tap(')')">)</div>
        </div>
        <div class="kb-row">
            <div class="key sub" onclick="KB.tap('₂')">₂</div>
            <div class="key sub" onclick="KB.tap('₃')">₃</div>
            <div class="key sub" onclick="KB.tap('₄')">₄</div>
            <div class="key sub" onclick="KB.tap('₆')">₆</div> <div class="key sub" onclick="KB.tap('₅')">₅</div> <div class="key sub" onclick="KB.tap('₇')">₇</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('Q')">Q</div><div class="key" onclick="KB.tap('W')">W</div>
            <div class="key" onclick="KB.tap('E')">E</div><div class="key" onclick="KB.tap('R')">R</div>
            <div class="key" onclick="KB.tap('T')">T</div><div class="key" onclick="KB.tap('Y')">Y</div>
            <div class="key" onclick="KB.tap('U')">U</div><div class="key" onclick="KB.tap('I')">I</div>
            <div class="key" onclick="KB.tap('O')">O</div><div class="key" onclick="KB.tap('P')">P</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('A')">A</div><div class="key" onclick="KB.tap('S')">S</div>
            <div class="key" onclick="KB.tap('D')">D</div><div class="key" onclick="KB.tap('F')">F</div>
            <div class="key" onclick="KB.tap('G')">G</div><div class="key" onclick="KB.tap('H')">H</div>
            <div class="key" onclick="KB.tap('J')">J</div><div class="key" onclick="KB.tap('K')">K</div>
            <div class="key" onclick="KB.tap('L')">L</div>
        </div>
        <div class="kb-row">
            <div class="key shift" id="btnShift" onclick="KB.toggleShift()">⬆</div>
            <div class="key" onclick="KB.tap('Z')">Z</div><div class="key" onclick="KB.tap('X')">X</div>
            <div class="key" onclick="KB.tap('C')">C</div><div class="key" onclick="KB.tap('V')">V</div>
            <div class="key" onclick="KB.tap('B')">B</div><div class="key" onclick="KB.tap('N')">N</div>
            <div class="key" onclick="KB.tap('M')">M</div>
            <div class="key del" onclick="KB.del()">⌫</div>
        </div>
        <div class="kb-row">
            <div class="key enter" onclick="Game.check()">提交答案</div>
        </div>
    </div>

<script>
/* ================= 核心数据库 (带下标修正) ================= */
// 注意：ans 字段现在必须使用下标，如 H₂O，因为键盘输入的是下标
const DB = [
    // S1: 符号
    { difficulty:1, type:'element', q:'氢', ans:'H', desc:'原子序数1' },
    { difficulty:1, type:'element', q:'氦', ans:'He', desc:'稀有气体' },
    { difficulty:1, type:'element', q:'碳', ans:'C', desc:'有机物骨架' },
    { difficulty:1, type:'element', q:'钠', ans:'Na', desc:'焰色反应黄色' },
    { difficulty:1, type:'element', q:'氯', ans:'Cl', desc:'黄绿色气体' },
    
    // S2: 离子 (上标)
    { difficulty:2, type:'ion', q:'氢离子', ans:'H⁺', desc:'酸性' },
    { difficulty:2, type:'ion', q:'钠离子', ans:'Na⁺', desc:'生理盐水' },
    { difficulty:2, type:'ion', q:'镁离子', ans:'Mg²⁺', desc:'叶绿素中心' },
    { difficulty:2, type:'ion', q:'氯离子', ans:'Cl⁻', desc:'盐酸根' },
    { difficulty:2, type:'ion', q:'硫酸根', ans:'SO₄²⁻', desc:'常见酸根' }, // 注意这里用了下标4
    { difficulty:2, type:'ion', q:'碳酸根', ans:'CO₃²⁻', desc:'遇酸冒泡' }, // 注意这里用了下标3
    
    // S3: 化学式 (上标+下标混合)
    { difficulty:3, type:'formula', q:'水', ans:'H₂O', desc:'生命之源', 
      detail: 'H(+1) O(-2) => H₂O' },
    { difficulty:3, type:'formula', q:'二氧化碳', ans:'CO₂', desc:'温室气体', 
      detail: 'C(+4) O(-2) => CO₂' },
    { difficulty:3, type:'formula', q:'氧化铁', ans:'Fe₂O₃', desc:'铁锈成分', 
      detail: 'Fe(+3) O(-2) => 交叉配平 => Fe₂O₃' },
    { difficulty:3, type:'formula', q:'硫酸钠', ans:'Na₂SO₄', desc:'芒硝', 
      detail: 'Na(+1) SO₄(-2) => Na₂SO₄' },
    { difficulty:3, type:'formula', q:'氢氧化钙', ans:'Ca(OH)₂', desc:'熟石灰', 
      detail: 'Ca(+2) OH(-1) => Ca(OH)₂' }
];

/* ================= 关卡配置 ================= */
const STAGES = [
    { id: 1, name: "S1 元素认知", filter: i=>i.type==='element', target: 5, hint: "提示: 注意大小写" },
    { id: 2, name: "S2 离子觉醒", filter: i=>i.type==='ion', target: 5, hint: "提示: 键盘第一排选电荷" },
    { id: 3, name: "S3 物质构建", filter: i=>i.type==='formula', target: 5, hint: "提示: 键盘第二排选数字下标" }
];

const Game = {
    stageIdx: 0,
    progress: 0,
    score: 0,
    lives: 3,
    currQ: null,
    
    start() {
        document.getElementById('menuOverlay').classList.remove('active');
        document.getElementById('hudArea').classList.remove('hidden');
        document.getElementById('gameCard').classList.remove('hidden');
        document.getElementById('kbArea').classList.remove('hidden');
        
        this.stageIdx = 0;
        this.score = 0;
        this.lives = 3;
        this.initStage();
    },

    initStage() {
        this.progress = 0;
        document.getElementById('stageName').innerText = STAGES[this.stageIdx].name;
        this.nextQuestion();
    },
    
    nextQuestion() {
        const stage = STAGES[this.stageIdx];
        
        // === 关卡判定逻辑 (修复：增加弹窗) ===
        if (this.progress >= stage.target) {
            this.showLevelClear(); // <--- 这里就是你要的“心理准备”
            return;
        }

        // 随机出题
        const pool = DB.filter(stage.filter);
        this.currQ = pool[Math.floor(Math.random() * pool.length)];
        
        // 渲染
        document.getElementById('qTag').innerText = this.currQ.type.toUpperCase();
        document.getElementById('qDisplay').innerHTML = `<div style="font-size:40px">${this.currQ.q}</div>`;
        document.getElementById('inputAns').value = "";
        document.getElementById('inputAns').className = "";
        
        // Hint
        const hintEl = document.getElementById('hintText');
        if (this.progress === 0) {
            hintEl.innerText = stage.hint;
            hintEl.style.opacity = 1;
        } else {
            hintEl.style.opacity = 0;
        }
        
        UI.updateHUD();
    },

    // 核心：关卡结算弹窗
    showLevelClear() {
        const ov = document.getElementById('levelClearOverlay');
        const msg = document.getElementById('levelClearMsg');
        
        if (this.stageIdx < STAGES.length - 1) {
            msg.innerText = `S${this.stageIdx+1} 完成！\n准备挑战下一关：${STAGES[this.stageIdx+1].name}`;
            ov.classList.add('active');
        } else {
            // 通关
            msg.innerText = "你已征服所有元素试炼！化学大师！";
            document.querySelector('#levelClearOverlay button').innerText = "重头再来";
            document.querySelector('#levelClearOverlay button').onclick = () => location.reload();
            ov.classList.add('active');
        }
    },

    // 点击“进入下一关”
    nextStageAction() {
        document.getElementById('levelClearOverlay').classList.remove('active');
        this.stageIdx++;
        this.initStage();
    },

    check() {
        const input = document.getElementById('inputAns').value;
        if (!input) return;

        if (input === this.currQ.ans) {
            // 正确
            this.progress++;
            this.score += 10;
            VFX.boom();
            
            document.getElementById('inputAns').classList.add('correct');
            document.getElementById('gameCard').classList.remove('pop');
            void document.getElementById('gameCard').offsetWidth; 
            document.getElementById('gameCard').classList.add('pop');
            
            setTimeout(() => this.nextQuestion(), 500);
        } else {
            // 错误
            this.lives--;
            document.getElementById('gameCard').classList.add('shake-anim');
            setTimeout(()=>document.getElementById('gameCard').classList.remove('shake-anim'), 400);
            
            UI.updateHUD();
            if (this.lives <= 0) {
                alert("Game Over! Score: " + this.score);
                location.reload();
            } else {
                UI.showFeedback(input);
            }
        }
    }
};

const UI = {
    updateHUD() {
        document.getElementById('scoreDisplay').innerText = Game.score;
        document.getElementById('livesDisplay').innerText = "❤".repeat(Game.lives);
        const stage = STAGES[Game.stageIdx];
        const pct = (Game.progress / stage.target) * 100;
        document.getElementById('stageProgress').style.width = pct + "%";
    },
    
    showFeedback(wrongVal) {
        const ov = document.getElementById('feedbackOverlay');
        const q = Game.currQ;
        let html = `
            <div>你的答案：<span style="text-decoration:line-through;color:var(--error)">${wrongVal}</span></div>
            <div style="margin-top:5px;font-weight:bold;font-size:18px;color:var(--success)">正确答案：${q.ans}</div>
            <div style="margin-top:15px;font-size:13px;color:#666">${q.desc || ''}</div>
        `;
        if (q.detail) {
            html += `<div class="math-expl">${q.detail}</div>`;
        }
        document.getElementById('fbDetail').innerHTML = html;
        ov.classList.add('active');
    },
    
    hideFeedback() {
        document.getElementById('feedbackOverlay').classList.remove('active');
        Game.nextQuestion();
    }
};

const KB = {
    isShift: true,
    tap(char) {
        let c = char;
        if (/[a-z]/i.test(c) && c.length === 1) {
            c = this.isShift ? c.toUpperCase() : c.toLowerCase();
            if (this.isShift) this.toggleShift();
        }
        const inp = document.getElementById('inputAns');
        inp.value += c;
        inp.classList.add('active');
        setTimeout(()=>inp.classList.remove('active'), 100);
    },
    del() {
        const inp = document.getElementById('inputAns');
        inp.value = inp.value.slice(0, -1);
        if(inp.value.length===0) { this.isShift=true; this.render(); }
    },
    toggleShift() { this.isShift = !this.isShift; this.render(); },
    render() {
        const btn = document.getElementById('btnShift');
        if(this.isShift) btn.classList.add('active'); else btn.classList.remove('active');
        document.querySelectorAll('.key').forEach(k => {
            const t = k.innerText;
            if(t.length===1 && /[a-z]/i.test(t)) k.innerText = this.isShift ? t.toUpperCase() : t.toLowerCase();
        });
    }
};

const VFX = {
    boom() {
        const box = document.getElementById('inputAns');
        const rect = box.getBoundingClientRect();
        const colors = ['#6c5ce7', '#00b894', '#fdcb6e'];
        for(let i=0; i<20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
            const size = Math.random()*8+4;
            p.style.width = size+'px'; p.style.height = size+'px';
            p.style.left = (rect.left + rect.width/2) + 'px';
            p.style.top = (rect.top + rect.height/2) + 'px';
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 100 + 50;
            p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
            p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
            document.getElementById('vfx-layer').appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
    }
};
</script>
</body>
</html>
