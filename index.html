<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>⚡️ 元素风暴：最终觉醒</title>
    <style>
        :root {
            --primary: #6c5ce7; --accent: #a29bfe;
            --success: #00b894; --error: #d63031;
            --bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg); height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* === 视觉特效层 === */
        #vfx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
        
        /* 粒子爆炸动画 */
        .particle { position: absolute; border-radius: 50%; animation: boom 0.8s ease-out forwards; }
        @keyframes boom { 
            0% { transform: translate(0,0) scale(1); opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } 
        }
        
        /* 浮动夸奖文字 */
        .float-text {
            position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
            font-size: 40px; font-weight: 900; color: var(--success);
            text-shadow: 0 5px 20px rgba(0,184,148,0.6); z-index: 60;
            animation: floatUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes floatUp { 
            0% { opacity: 0; transform: translate(-50%, 20px) scale(0.5); } 
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); } 
            100% { opacity: 0; transform: translate(-50%, -100px) scale(1); } 
        }

        /* 屏幕震动 (答错时) */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 
            10%, 90% { transform: translate3d(-4px, 0, 0); } 
            20%, 80% { transform: translate3d(8px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 
            40%, 60% { transform: translate3d(8px, 0, 0); } 
        }

        /* === 游戏主界面 === */
        .hud-bar {
            position: fixed; top: 15px; width: 90%; max-width: 500px;
            display: flex; justify-content: space-between; z-index: 20;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
            padding: 8px 15px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .hud-item { font-size: 14px; color: #555; font-weight: bold; }
        .hud-val { color: var(--primary); margin-left: 5px; font-size: 16px; }

        .game-card {
            position: relative; width: 90%; max-width: 420px;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-radius: 24px; padding: 30px 20px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); z-index: 10;
            transition: transform 0.1s;
        }

        .q-badge { background: #dfe6e9; color: #636e72; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .q-display { font-size: 56px; font-weight: 900; color: #2d3436; margin: 10px 0; letter-spacing: 1px; }
        
        .q-hint { height: 20px; font-size: 13px; color: var(--error); margin-bottom: 15px; opacity: 1; transition: opacity 0.3s; font-weight: bold; }
        
        .input-area {
            background: #f1f2f6; border-radius: 16px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; color: #2d3436; font-family: monospace;
            border: 3px solid transparent; transition: all 0.2s; position: relative;
        }
        .input-area.focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.2); }
        .cursor { width: 3px; height: 32px; background: var(--primary); margin-left: 4px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* === 键盘 === */
        .keyboard {
            position: absolute; bottom: 0; width: 100%; max-width: 600px;
            background: #fff; border-radius: 24px 24px 0 0; padding: 10px 5px 30px 5px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1); z-index: 30;
        }
        .kb-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 6px; }
        .key {
            flex: 1; height: 48px; max-width: 50px;
            background: #fff; border: 1px solid #dfe6e9; border-bottom: 3px solid #b2bec3;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 19px; font-weight: 700; color: #2d3436; cursor: pointer;
            transition: all 0.05s;
        }
        .key:active { transform: translateY(3px); border-bottom-width: 0; background: #f1f2f6; }
        
        .key.chem { background: #e3f2fd; color: #0984e3; border-color: #74b9ff; }
        .key.enter { flex: 2.5; max-width: 120px; background: var(--success); color: white; border-color: #009476; }
        .key.del { background: var(--error); color: white; border-color: #c0392b; }
        .key.shift { background: #ffeaa7; color: #d35400; border-color: #fdcb6e; }
        .key.shift.active { background: #fdcb6e; color: white; transform: translateY(3px); border-bottom-width: 0; }

        /* === 弹窗 (剧情 & 反馈) === */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal {
            background: white; width: 85%; max-width: 360px; padding: 30px; border-radius: 24px;
            text-align: center; animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes zoomIn { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
        
        .modal h2 { font-size: 28px; margin-bottom: 10px; color: var(--primary); }
        .modal p { color: #636e72; line-height: 1.6; margin-bottom: 20px; }
        
        /* 错题修正框 */
        .correction-box {
            background: #ffeaa7; border: 2px dashed #fdcb6e; border-radius: 12px;
            padding: 15px; margin-bottom: 20px; text-align: left;
        }
        .cr-row { display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px; }
        .cr-val { font-family: monospace; font-size: 18px; font-weight: bold; }

        .btn {
            background: var(--primary); color: white; padding: 12px 40px; border: none;
            border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4); transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="vfx-layer"></div>

    <div class="hud-bar hidden" id="hud">
        <div class="hud-item">关卡<span class="hud-val" id="disp-stage">S1</span></div>
        <div class="hud-item">进度<span class="hud-val" id="disp-prog">0/8</span></div>
        <div class="hud-item">分数<span class="hud-val" id="disp-score">0</span></div>
    </div>

    <div class="game-card hidden" id="card">
        <span class="q-badge" id="disp-tag">题目</span>
        <div class="q-display" id="disp-q">H</div>
        <div class="q-hint" id="disp-hint">提示：注意大小写</div>
        
        <div class="input-area" id="input-box">
            <span id="input-txt"></span><div class="cursor"></div>
        </div>
    </div>

    <div class="keyboard hidden" id="kb">
        <div class="kb-row">
            <div class="key chem" onclick="KB.tap('⁺')">⁺</div>
            <div class="key chem" onclick="KB.tap('⁻')">⁻</div>
            <div class="key chem" onclick="KB.tap('²')">²</div>
            <div class="key chem" onclick="KB.tap('³')">³</div>
            <div class="key chem" onclick="KB.tap('(')">(</div>
            <div class="key chem" onclick="KB.tap(')')">)</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('Q')">Q</div><div class="key" onclick="KB.tap('W')">W</div>
            <div class="key" onclick="KB.tap('E')">E</div><div class="key" onclick="KB.tap('R')">R</div>
            <div class="key" onclick="KB.tap('T')">T</div><div class="key" onclick="KB.tap('Y')">Y</div>
            <div class="key" onclick="KB.tap('U')">U</div><div class="key" onclick="KB.tap('I')">I</div>
            <div class="key" onclick="KB.tap('O')">O</div><div class="key" onclick="KB.tap('P')">P</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('A')">A</div><div class="key" onclick="KB.tap('S')">S</div>
            <div class="key" onclick="KB.tap('D')">D</div><div class="key" onclick="KB.tap('F')">F</div>
            <div class="key" onclick="KB.tap('G')">G</div><div class="key" onclick="KB.tap('H')">H</div>
            <div class="key" onclick="KB.tap('J')">J</div><div class="key" onclick="KB.tap('K')">K</div>
            <div class="key" onclick="KB.tap('L')">L</div>
        </div>
        <div class="kb-row">
            <div class="key shift" id="k-shift" onclick="KB.toggleShift()">⬆</div>
            <div class="key" onclick="KB.tap('Z')">Z</div><div class="key" onclick="KB.tap('X')">X</div>
            <div class="key" onclick="KB.tap('C')">C</div><div class="key" onclick="KB.tap('V')">V</div>
            <div class="key" onclick="KB.tap('B')">B</div><div class="key" onclick="KB.tap('N')">N</div>
            <div class="key" onclick="KB.tap('M')">M</div>
            <div class="key del" onclick="KB.del()">⌫</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('1')">1</div><div class="key" onclick="KB.tap('2')">2</div>
            <div class="key" onclick="KB.tap('3')">3</div><div class="key" onclick="KB.tap('4')">4</div>
            <div class="key enter" onclick="Game.check()">提交</div>
        </div>
    </div>

    <div class="overlay active" id="ov-menu">
        <div class="modal">
            <h2>⚡️ 元素风暴</h2>
            <p>欢迎来到化学试炼场。<br>这是一场速度与记忆的战争。<br>准备好接受洗礼了吗？</p>
            <button class="btn" onclick="Game.start()">开始试炼</button>
        </div>
    </div>

    <div class="overlay" id="ov-fail">
        <div class="modal">
            <h2 style="color:var(--error)">💥 任务失败</h2>
            <div class="correction-box">
                <div class="cr-row">
                    <span>你的答案</span>
                    <span class="cr-val" style="color:var(--error); text-decoration:line-through" id="res-wrong"></span>
                </div>
                <div class="cr-row">
                    <span>正确答案</span>
                    <span class="cr-val" style="color:#2d3436" id="res-right"></span>
                </div>
            </div>
            <p style="font-size:12px">别灰心，化学键正在重组...</p>
            <button class="btn" onclick="Game.next()">继续挑战</button>
        </div>
    </div>

<script>
// 题目数据
const DATA = {
    s1: [
        {q:"氢", a:"H"}, {q:"氦", a:"He"}, {q:"碳", a:"C"}, {q:"氮", a:"N"}, {q:"氧", a:"O"},
        {q:"氟", a:"F"}, {q:"氖", a:"Ne"}, {q:"钠", a:"Na"}, {q:"镁", a:"Mg"}, {q:"铝", a:"Al"},
        {q:"硅", a:"Si"}, {q:"磷", a:"P"}, {q:"硫", a:"S"}, {q:"氯", a:"Cl"}, {q:"钾", a:"K"}, 
        {q:"钙", a:"Ca"}, {q:"锰", a:"Mn"}, {q:"铁", a:"Fe"}, {q:"铜", a:"Cu"}, {q:"银", a:"Ag"}
    ],
    s2: [
        {q:"氢离子", a:"H⁺"}, {q:"钠离子", a:"Na⁺"}, {q:"镁离子", a:"Mg²⁺"}, {q:"铝离子", a:"Al³⁺"},
        {q:"钾离子", a:"K⁺"}, {q:"钙离子", a:"Ca²⁺"}, {q:"铁离子", a:"Fe³⁺"}, {q:"亚铁离子", a:"Fe²⁺"},
        {q:"铜离子", a:"Cu²⁺"}, {q:"银离子", a:"Ag⁺"}, {q:"铵根", a:"NH4⁺"}, 
        {q:"氢氧根", a:"OH⁻"}, {q:"硝酸根", a:"NO3⁻"}, {q:"硫酸根", a:"SO4²⁻"}, {q:"碳酸根", a:"CO3²⁻"}
    ],
    s3: [
        {q:"水", a:"H2O"}, {q:"二氧化碳", a:"CO2"}, {q:"氯化钠", a:"NaCl"}, {q:"氧化镁", a:"MgO"},
        {q:"五氧化二磷", a:"P2O5"}, {q:"四氧化三铁", a:"Fe3O4"}, {q:"氯酸钾", a:"KClO3"},
        {q:"硫酸铜", a:"CuSO4"}, {q:"碳酸钙", a:"CaCO3"}, {q:"氢氧化钙", a:"Ca(OH)2"},
        {q:"硫酸铝", a:"Al2(SO4)3"}
    ]
};

// 关卡配置
const LEVELS = [
    { id:'s1', name:'S1 元素觉醒', count:8, hint:'提示：注意大小写 (如 Na)' },
    { id:'s2', name:'S2 离子风暴', count:8, hint:'提示：记得带电荷 (如 Na⁺)' },
    { id:'s3', name:'S3 物质构建', count:8, hint:'提示：原子团若有角标需加括号' }
];

const Game = {
    lvlIdx: 0,
    qIdx: 0,
    score: 0,
    curr: null,

    start() {
        document.getElementById('ov-menu').classList.remove('active');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('card').classList.remove('hidden');
        document.getElementById('kb').classList.remove('hidden');
        this.lvlIdx = 0;
        this.score = 0;
        this.loadLevel();
    },

    loadLevel() {
        this.qIdx = 0;
        this.nextQ();
    },

    nextQ() {
        // 过关判断
        const cfg = LEVELS[this.lvlIdx];
        if(this.qIdx >= cfg.count) {
            if(this.lvlIdx < LEVELS.length - 1) {
                this.lvlIdx++; // 无缝下一关
                this.loadLevel();
            } else {
                this.showEnd();
            }
            return;
        }

        // 取题
        const pool = DATA[cfg.id];
        this.curr = pool[Math.floor(Math.random()*pool.length)];

        // UI更新
        document.getElementById('disp-stage').innerText = cfg.name.split(' ')[0];
        document.getElementById('disp-prog').innerText = `${this.qIdx}/${cfg.count}`;
        document.getElementById('disp-score').innerText = this.score;
        document.getElementById('disp-tag').innerText = cfg.name;
        document.getElementById('disp-q').innerText = this.curr.q;
        document.getElementById('input-txt').innerText = "";
        
        // 提示逻辑：只在第1题显示
        const h = document.getElementById('disp-hint');
        h.innerText = cfg.hint;
        h.style.opacity = (this.qIdx === 0) ? 1 : 0;

        KB.reset();
    },

    check() {
        const input = document.getElementById('input-txt').innerText;
        if(!input) return;

        if(input === this.curr.a) {
            // === 答对：爽感特效 ===
            this.score += 10;
            this.qIdx++;
            
            // 1. 粒子爆炸
            VFX.boom();
            // 2. 浮动夸奖
            VFX.praise();
            
            // 下一题
            this.nextQ();
        } else {
            // === 答错：震动 + 反馈 ===
            // 1. 屏幕震动
            document.body.classList.remove('shake');
            void document.body.offsetWidth; // 强制重绘
            document.body.classList.add('shake');
            
            // 2. 弹出红框对比
            document.getElementById('res-wrong').innerText = input;
            document.getElementById('res-right').innerText = this.curr.a;
            document.getElementById('ov-fail').classList.add('active');
        }
    },

    next() {
        // 关闭错误弹窗，继续下一题
        document.getElementById('ov-fail').classList.remove('active');
        this.nextQ(); // 答错也换题，防止卡死
    },

    showEnd() {
        alert("🎉 恭喜！你已通关所有试炼！");
        location.reload();
    }
};

// 视觉特效库
const VFX = {
    boom() {
        const box = document.getElementById('input-box');
        const rect = box.getBoundingClientRect();
        const colors = ['#6c5ce7', '#00b894', '#fdcb6e', '#ff7675'];
        
        for(let i=0; i<30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
            const size = Math.random()*10 + 5;
            p.style.width = size+'px'; p.style.height = size+'px';
            p.style.left = (rect.left + rect.width/2) + 'px';
            p.style.top = (rect.top + rect.height/2) + 'px';
            
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 150 + 50;
            p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
            p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
            
            document.getElementById('vfx-layer').appendChild(p);
            setTimeout(() => p.remove(), 800);
        }
    },
    praise() {
        const texts = ["PERFECT!", "GENIUS!", "AMAZING!", "WOW!"];
        const t = document.createElement('div');
        t.className = 'float-text';
        t.innerText = texts[Math.floor(Math.random()*texts.length)];
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1000);
    }
};

// 键盘逻辑
const KB = {
    isShift: true,
    tap(c) {
        if(/[a-z]/i.test(c) && c.length===1) {
            c = this.isShift ? c.toUpperCase() : c.toLowerCase();
            if(this.isShift) this.toggleShift();
        }
        document.getElementById('input-txt').innerText += c;
        
        // 极简按键反馈
        const box = document.getElementById('input-box');
        box.classList.add('focus');
        setTimeout(() => box.classList.remove('focus'), 100);
    },
    del() {
        const t = document.getElementById('input-txt');
        t.innerText = t.innerText.slice(0, -1);
        if(!t.innerText) { this.isShift = true; this.render(); }
    },
    toggleShift() { this.isShift = !this.isShift; this.render(); },
    reset() { this.isShift = true; this.render(); },
    render() {
        const b = document.getElementById('k-shift');
        this.isShift ? b.classList.add('active') : b.classList.remove('active');
        document.querySelectorAll('.key').forEach(k => {
            const t = k.innerText;
            if(t.length===1 && /[a-z]/i.test(t)) k.innerText = this.isShift ? t.toUpperCase() : t.toLowerCase();
        });
    }
};

// 物理按键监听
document.addEventListener('keydown', e => {
    if(e.key === 'Enter') {
        if(document.getElementById('ov-menu').classList.contains('active')) Game.start();
        else if(document.getElementById('ov-fail').classList.contains('active')) Game.next();
        else Game.check();
    }
    else if(e.key === 'Backspace') KB.del();
    else if(e.key.length === 1) KB.tap(e.key);
});
</script>
</body>
</html>
