<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>⚡️ 元素风暴：化学骑士 (剧情完整版)</title>
    <style>
        :root {
            --primary: #4834d4; --accent: #686de0;
            --success: #00b894; --error: #d63031;
            --bg-normal: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --bg-boss: radial-gradient(circle at center, #2d3436 0%, #000000 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-normal);
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            transition: background 1.5s ease;
        }
        
        /* === 3A 视觉状态 === */
        body.boss-mode { background: var(--bg-boss); }
        body.boss-mode .hud-box { background: rgba(50,50,50,0.8); color: #fff; border: 1px solid var(--error); }
        body.boss-mode .game-card { background: rgba(30,30,30,0.95); border: 2px solid var(--error); box-shadow: 0 0 30px rgba(214, 48, 49, 0.4); }
        body.boss-mode .q-display { color: var(--error); text-shadow: 0 0 10px var(--error); }

        /* === 粒子与特效层 === */
        #vfx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; animation: boom 0.6s ease-out forwards; }
        @keyframes boom { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); } }
        
        .shake-screen { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }

        /* === 浮动夸奖文字 (答对反馈) === */
        .praise-text {
            position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
            font-size: 40px; font-weight: 900; color: var(--success);
            text-shadow: 0 5px 15px rgba(0,184,148,0.5);
            pointer-events: none; z-index: 999;
            animation: floatUp 0.8s forwards;
        }
        @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); } 20% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -80px) scale(1); } }

        /* === HUD === */
        .hud { padding: 10px 15px; display: flex; justify-content: space-between; z-index: 20; position: relative; }
        .hud-box {
            background: rgba(255,255,255,0.8); padding: 5px 15px; border-radius: 12px;
            font-weight: bold; color: #333; backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; min-width: 80px;
            transition: all 0.5s;
        }
        .hp-bar { width: 100px; height: 6px; background: rgba(0,0,0,0.1); border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .hp-fill { height: 100%; transition: width 0.3s; }

        /* === 游戏卡片 === */
        .arena { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; perspective: 1000px; }
        .game-card {
            width: 90%; max-width: 500px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
            border-radius: 24px; padding: 25px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transition: all 0.3s; position: relative;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .q-tag { display: inline-block; background: #636e72; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; font-weight: bold; }
        .q-display { font-size: 48px; font-weight: 900; color: #2d3436; margin: 5px 0 15px; min-height: 60px; }
        
        /* 智能提示 (PDF需求) */
        .q-hint { height: 20px; font-size: 13px; color: #b2bec3; margin-bottom: 10px; transition: opacity 0.5s; }
        .hint-hidden { opacity: 0; }

        .input-box {
            background: #f1f2f6; border-radius: 16px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; color: #2d3436; font-family: monospace;
            border: 2px solid transparent; transition: all 0.2s; position: relative;
        }
        .input-box.active { background: white; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(72,52,212,0.2); }
        .cursor { width: 3px; height: 32px; background: var(--primary); animation: blink 1s infinite; margin-left: 4px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* === 键盘区域 === */
        .keyboard {
            width: 100%; max-width: 800px;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0; padding: 10px 5px 25px 5px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1); z-index: 100;
            transition: all 0.5s;
        }
        body.boss-mode .keyboard { background: rgba(30,30,30,0.95); border-top: 1px solid var(--error); }

        .kb-row { display: flex; justify-content: center; width: 100%; margin-bottom: 6px; gap: 4px; }
        .key {
            flex: 1; height: 46px; max-width: 48px;
            background: #fff; border-radius: 8px; border-bottom: 3px solid #b2bec3;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: #2d3436; cursor: pointer;
            transition: all 0.1s;
        }
        .key:active { transform: translateY(4px); border-bottom-width: 0; }
        
        body.boss-mode .key { background: #444; color: #fff; border-color: #222; }
        
        .key.chem { background: #e3f2fd; color: #0984e3; border-color: #74b9ff; font-size: 16px; }
        .key.enter { flex: 2; max-width: 100px; background: var(--success); color: white; border-color: #009476; }
        .key.del { background: #fab1a0; color: white; border-color: #e17055; }
        .key.shift { background: #ffeaa7; color: #d35400; border-color: #fdcb6e; }
        .key.shift.active { background: #fdcb6e; color: white; transform: translateY(2px); border-bottom-width: 0; }

        /* === 菜单/剧情/反馈弹窗 === */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        .modal.visible { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: white; padding: 40px; border-radius: 20px; text-align: center; width: 85%; max-width: 400px;
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .btn-start {
            margin-top: 30px; padding: 15px 50px; font-size: 22px; font-weight: bold;
            color: white; background: var(--primary); border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(72, 52, 212, 0.4);
            transition: transform 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }

        /* 错题反馈框 (PDF要求) */
        .correction-box {
            background: #fff5f5; border: 2px dashed var(--error); border-radius: 10px;
            padding: 15px; margin-top: 20px; text-align: left;
        }
        .cr-row { display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px; }
        .cr-val { font-family: monospace; font-size: 18px; font-weight: bold; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="vfx-layer"></div>

    <div class="modal visible" id="startScreen">
        <div class="modal-content">
            <h1 style="color:var(--primary); font-size:40px; margin-bottom:10px">元素风暴</h1>
            <p style="color:#636e72; font-size:16px; line-height:1.6">
                欢迎来到化学试炼场。<br>你将面对元素、离子与化合价的终极挑战。<br>准备好你的键盘，骑士！
            </p>
            <button class="btn-start" onclick="Game.startGame()">开始试炼</button>
        </div>
    </div>

    <div class="hud">
        <div class="hud-box">
            <span style="font-size:10px; opacity:0.6">HP</span>
            <div class="hp-bar"><div class="hp-fill" id="bar-life" style="background:#ff7675; width:100%"></div></div>
        </div>
        <div class="hud-box" style="flex:1; margin:0 10px">
            <div id="stage-txt" style="font-size:16px;">S1: 元素觉醒</div>
            <div class="hp-bar" style="width:100%"><div class="hp-fill" id="bar-prog" style="background:var(--primary); width:0%"></div></div>
            <div style="font-size:10px; margin-top:2px; opacity:0.6" id="prog-txt">0 / 8</div>
        </div>
        <div class="hud-box">
            <span style="font-size:10px; opacity:0.6">SCORE</span>
            <div style="color:var(--primary); font-size:20px" id="score-txt">0</div>
        </div>
    </div>

    <div class="arena">
        <div class="game-card" id="card">
            <div class="q-tag" id="q-tag">题目</div>
            <div class="q-display" id="q-text">Loading...</div>
            
            <div class="q-hint" id="q-hint">提示信息</div>

            <div class="input-box" id="input-slot">
                <span id="input-val"></span><div class="cursor"></div>
            </div>
        </div>
    </div>

    <div class="keyboard">
        <div class="kb-row">
            <div class="key chem" onclick="KB.tap('⁺')">⁺</div>
            <div class="key chem" onclick="KB.tap('⁻')">⁻</div>
            <div class="key chem" onclick="KB.tap('²')">²</div>
            <div class="key chem" onclick="KB.tap('³')">³</div>
            <div class="key chem" onclick="KB.tap('(')">(</div>
            <div class="key chem" onclick="KB.tap(')')">)</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('Q')">Q</div><div class="key" onclick="KB.tap('W')">W</div>
            <div class="key" onclick="KB.tap('E')">E</div><div class="key" onclick="KB.tap('R')">R</div>
            <div class="key" onclick="KB.tap('T')">T</div><div class="key" onclick="KB.tap('Y')">Y</div>
            <div class="key" onclick="KB.tap('U')">U</div><div class="key" onclick="KB.tap('I')">I</div>
            <div class="key" onclick="KB.tap('O')">O</div><div class="key" onclick="KB.tap('P')">P</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('A')">A</div><div class="key" onclick="KB.tap('S')">S</div>
            <div class="key" onclick="KB.tap('D')">D</div><div class="key" onclick="KB.tap('F')">F</div>
            <div class="key" onclick="KB.tap('G')">G</div><div class="key" onclick="KB.tap('H')">H</div>
            <div class="key" onclick="KB.tap('J')">J</div><div class="key" onclick="KB.tap('K')">K</div>
            <div class="key" onclick="KB.tap('L')">L</div>
        </div>
        <div class="kb-row">
            <div class="key shift" id="btn-shift" onclick="KB.toggleShift()">⬆</div>
            <div class="key" onclick="KB.tap('Z')">Z</div><div class="key" onclick="KB.tap('X')">X</div>
            <div class="key" onclick="KB.tap('C')">C</div><div class="key" onclick="KB.tap('V')">V</div>
            <div class="key" onclick="KB.tap('B')">B</div><div class="key" onclick="KB.tap('N')">N</div>
            <div class="key" onclick="KB.tap('M')">M</div>
            <div class="key del" onclick="KB.del()">⌫</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('1')">1</div><div class="key" onclick="KB.tap('2')">2</div>
            <div class="key" onclick="KB.tap('3')">3</div><div class="key" onclick="KB.tap('4')">4</div>
            <div class="key enter" onclick="Game.check()">提交</div>
        </div>
    </div>

    <div class="modal" id="endModal">
        <div class="modal-content">
            <h1 id="end-title" style="margin-bottom:10px"></h1>
            <div id="end-body"></div>
            <div id="wrong-feedback" class="correction-box hidden">
                <div class="cr-row">
                    <span>你的答案</span>
                    <span class="cr-val" style="color:var(--error); text-decoration:line-through" id="user-wrong"></span>
                </div>
                <div class="cr-row">
                    <span>正确答案</span>
                    <span class="cr-val" style="color:var(--success)" id="real-right"></span>
                </div>
            </div>
            <button class="btn-start" id="end-btn" onclick="Game.init()">重新开始</button>
        </div>
    </div>

<script>
/* ================= 题库 (The Soul) ================= */
const DB = [
    { n:"氢", s:"H", v:1, g:1 }, { n:"碳", s:"C", v:4, g:1 }, { n:"氮", s:"N", v:-3, g:1 },
    { n:"氧", s:"O", v:-2, g:1 }, { n:"钠", s:"Na", v:1, g:1 }, { n:"镁", s:"Mg", v:2, g:1 },
    { n:"铝", s:"Al", v:3, g:1 }, { n:"硫", s:"S", v:-2, g:1 }, { n:"氯", s:"Cl", v:-1, g:1 },
    { n:"钾", s:"K", v:1, g:1 }, { n:"钙", s:"Ca", v:2, g:1 }, { n:"铁", s:"Fe", v:3, g:2 },
    { n:"铜", s:"Cu", v:2, g:2 }, { n:"银", s:"Ag", v:1, g:2 },
    // 原子团
    { n:"氢氧根", s:"OH", v:-1, isG:true }, { n:"硝酸根", s:"NO3", v:-1, isG:true },
    { n:"硫酸根", s:"SO4", v:-2, isG:true }, { n:"碳酸根", s:"CO3", v:-2, isG:true },
    { n:"铵根", s:"NH4", v:1, isG:true }
];

/* ================= 关卡配置 (The Rules) ================= */
const LEVELS = [
    {
        name: "S1: 元素觉醒", target: 8, hint: "注意大小写 (如 Na)",
        gen: () => {
            const d = rand(DB.filter(x => !x.isG));
            return { tag: "元素符号", q: d.n, a: d.s };
        }
    },
    {
        name: "S2: 离子风暴", target: 8, hint: "记得右上角电荷 (键盘第一排)",
        gen: () => {
            const d = rand(DB);
            let c = Math.abs(d.v);
            let s = d.v > 0 ? "⁺" : "⁻";
            let chg = (c > 1 ? (c==2?"²":"³") : "") + s; // 修正逻辑：1不写数字
            return { tag: "离子符号", q: d.n + (d.isG?"":"离子"), a: d.s + chg };
        }
    },
    {
        name: "BOSS: 混沌试炼", target: 99, hp: 5, boss: true, hint: "全神贯注！混合攻击！",
        gen: () => {
            if(Math.random()>0.5) return LEVELS[0].gen();
            return LEVELS[1].gen();
        }
    }
];

function rand(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

/* ================= 游戏引擎 (The Heart) ================= */
const Game = {
    lvl: 0, qIdx: 0, lives: 5, score: 0, curr: null, bossHp: 0,

    // 1. 启动剧情菜单
    showStartScreen() {
        document.getElementById('startScreen').classList.add('visible');
    },

    startGame() {
        document.getElementById('startScreen').classList.remove('visible');
        this.init();
    },

    init() {
        this.lvl = 0;
        this.lives = 5;
        this.score = 0;
        document.getElementById('endModal').classList.remove('visible');
        this.startLevel();
    },

    startLevel() {
        this.qIdx = 0;
        const cfg = LEVELS[this.lvl];
        
        // 视觉切换
        if(cfg.boss) {
            document.body.classList.add('boss-mode');
            this.bossHp = cfg.hp;
        } else {
            document.body.classList.remove('boss-mode');
        }
        
        document.getElementById('stage-txt').innerText = cfg.name;
        this.updateHUD();
        this.nextQ();
    },

    nextQ() {
        const cfg = LEVELS[this.lvl];
        
        // 胜利判断
        let done = cfg.boss ? (this.bossHp <= 0) : (this.qIdx >= cfg.target);
        if(done) {
            if(this.lvl < LEVELS.length - 1) {
                this.lvl++;
                this.startLevel(); // 无缝进入下一关
            } else {
                this.gameOver(true);
            }
            return;
        }

        this.curr = cfg.gen();
        
        // UI 渲染
        document.getElementById('q-tag').innerText = this.curr.tag;
        document.getElementById('q-text').innerText = this.curr.q;
        document.getElementById('input-val').innerText = "";
        KB.reset();

        // 核心逻辑：Hint 只在第1题显示
        const hintEl = document.getElementById('q-hint');
        if(this.qIdx === 0) {
            hintEl.innerText = cfg.hint;
            hintEl.style.opacity = 1;
        } else {
            hintEl.style.opacity = 0;
        }

        this.updateHUD();
    },

    check() {
        const input = document.getElementById('input-val').innerText;
        if(!input) return;

        if(input === this.curr.a) {
            // 正确：夸奖 + 粒子
            this.spawnPraise();
            this.spawnParticles(true);
            this.score += 10;
            
            if(LEVELS[this.lvl].boss) this.bossHp--;
            else this.qIdx++;
            
            setTimeout(() => this.nextQ(), 800);
        } else {
            // 错误：震动 + 红框
            this.spawnParticles(false);
            document.body.classList.remove('shake-screen');
            void document.body.offsetWidth;
            document.body.classList.add('shake-screen');
            
            this.lives--;
            if(this.lives <= 0) {
                this.gameOver(false, input);
            } else {
                this.updateHUD();
            }
        }
    },

    updateHUD() {
        const cfg = LEVELS[this.lvl];
        document.getElementById('score-txt').innerText = this.score;
        document.getElementById('bar-life').style.width = (this.lives / 5 * 100) + "%";
        
        let pct = 0;
        if(cfg.boss) {
            pct = (this.bossHp / cfg.hp) * 100;
            document.getElementById('prog-txt').innerText = "BOSS: " + this.bossHp;
            document.getElementById('bar-prog').style.background = "#d63031";
        } else {
            pct = (this.qIdx / cfg.target) * 100;
            document.getElementById('prog-txt').innerText = this.qIdx + " / " + cfg.target;
            document.getElementById('bar-prog').style.background = "var(--primary)";
        }
        document.getElementById('bar-prog').style.width = pct + "%";
    },

    gameOver(win, wrongInput) {
        const m = document.getElementById('endModal');
        const t = document.getElementById('end-title');
        const b = document.getElementById('end-body');
        const fb = document.getElementById('wrong-feedback');
        
        m.classList.add('visible');
        if(win) {
            t.innerText = "🎉 传说达成！";
            t.style.color = "var(--success)";
            b.innerText = "你已征服所有元素，成为化学骑士！";
            fb.classList.add('hidden');
        } else {
            t.innerText = "💔 任务失败";
            t.style.color = "var(--error)";
            b.innerText = "生命值耗尽...";
            fb.classList.remove('hidden');
            document.getElementById('user-wrong').innerText = wrongInput;
            document.getElementById('real-right').innerText = this.curr.a;
        }
    },

    spawnParticles(success) {
        const box = document.getElementById('input-slot');
        const rect = box.getBoundingClientRect();
        const color = success ? '#00b894' : '#d63031';
        
        for(let i=0; i<20; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.background = color;
            p.style.width = (Math.random()*8+4)+'px';
            p.style.height = p.style.width;
            p.style.left = (rect.left + rect.width/2) + 'px';
            p.style.top = (rect.top + rect.height/2) + 'px';
            
            let angle = Math.random() * Math.PI * 2;
            let dist = Math.random() * 100 + 50;
            p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
            p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
            
            document.getElementById('vfx-layer').appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
    },

    spawnPraise() {
        const words = ["PERFECT!", "GENIUS!", "AMAZING!", "WOW!"];
        const el = document.createElement('div');
        el.className = 'praise-text';
        el.innerText = words[Math.floor(Math.random()*words.length)];
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }
};

/* ================= 键盘 ================= */
const KB = {
    isShift: true,
    tap(char) {
        let c = char;
        if(/[a-z]/i.test(c) && c.length===1) {
            c = this.isShift ? c.toUpperCase() : c.toLowerCase();
            if(this.isShift) this.toggleShift();
        }
        // 化学式自动下标逻辑 (如输入数字)
        if(/[0-9]/.test(c)) {
            // 这里为了通用性，保持普通数字，或者你可以开启自动转换
            // c = "₀₁₂₃₄₅₆₇₈₉"[parseInt(c)]; // 如果需要自动变下标可解开注释
        }
        
        const box = document.getElementById('input-val');
        box.innerText += c;
        
        // 按键反馈
        const slot = document.getElementById('input-slot');
        slot.classList.add('active');
        setTimeout(() => slot.classList.remove('active'), 100);
    },
    del() {
        const box = document.getElementById('input-val');
        box.innerText = box.innerText.slice(0, -1);
        if(box.innerText.length === 0) { this.isShift = true; this.render(); }
    },
    reset() { this.isShift = true; this.render(); },
    toggleShift() { this.isShift = !this.isShift; this.render(); },
    render() {
        const btn = document.getElementById('btn-shift');
        if(this.isShift) btn.classList.add('active'); else btn.classList.remove('active');
        document.querySelectorAll('.key').forEach(k => {
            const t = k.innerText;
            if(t.length===1 && /[a-z]/i.test(t)) k.innerText = this.isShift ? t.toUpperCase() : t.toLowerCase();
        });
    }
};

// 物理键盘支持
document.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') Game.check();
    else if(e.key === 'Backspace') KB.del();
    else if(e.key.length === 1) KB.tap(e.key);
});

// 初始化显示主菜单
Game.showStartScreen();

</script>
</body>
</html>
