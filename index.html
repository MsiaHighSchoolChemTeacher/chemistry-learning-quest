<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>元素风暴：修复终版</title>
    <style>
        /* ================= 样式层 ================= */
        :root {
            --primary: #4834d4; 
            --success: #6ab04c; 
            --error: #eb4d4b;
            --warn: #f0932b;
            --bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg); height: 100vh; width: 100vw;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* 1. 顶部 HUD */
        .hud-bar {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 10px; display: flex; justify-content: space-between;
            z-index: 10; background: rgba(255,255,255,0.6); backdrop-filter: blur(5px);
        }
        .hud-item {
            background: white; padding: 5px 15px; border-radius: 20px;
            font-size: 14px; font-weight: bold; color: #555;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .hud-num { color: var(--primary); margin-left: 5px; font-size: 16px; }

        /* 2. 游戏主界面 */
        .game-area {
            width: 100%; max-width: 450px; flex: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; z-index: 5;
        }
        
        .question-card {
            background: rgba(255,255,255,0.95);
            width: 90%; padding: 25px; border-radius: 24px;
            text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .pop { animation: popAnim 0.3s; }
        @keyframes popAnim { 50% { transform: scale(1.05); } }

        .q-tag { background: #dfe6e9; color: #636e72; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .q-text { font-size: 50px; font-weight: 900; color: #2d3436; margin: 10px 0; }
        
        /* PDF功能 P2: 提示语 (默认隐藏，JS控制显示) */
        .q-hint { 
            color: var(--warn); font-size: 13px; font-weight: bold; height: 20px; 
            margin-bottom: 5px; opacity: 0; transition: opacity 0.3s;
        }

        .input-display {
            background: #f1f2f6; width: 100%; height: 60px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; font-family: monospace; color: #2d3436;
            border: 2px solid transparent; margin-bottom: 10px;
        }
        .input-display.active { background: white; border-color: var(--primary); }
        .cursor { width: 3px; height: 30px; background: var(--primary); margin-left: 5px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 3. 键盘 (升级版) */
        .keyboard {
            width: 100%; max-width: 600px;
            background: rgba(255,255,255,0.95); border-radius: 20px 20px 0 0;
            padding: 10px 5px 25px 5px; position: absolute; bottom: 0; z-index: 20;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        .kb-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 5px; }
        .key {
            flex: 1; height: 44px; max-width: 50px;
            background: #fff; border-radius: 8px; border-bottom: 2px solid #b2bec3;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: bold; color: #2d3436; cursor: pointer;
        }
        .key:active { transform: translateY(2px); border-bottom: none; background: #eee; }
        
        .chem { background: #e3f2fd; color: #0984e3; border-color: #74b9ff; font-size: 15px; }
        .enter { flex: 2; max-width: 100px; background: var(--success); color: white; border-color: #498a28; }
        .del { background: var(--error); color: white; border-color: #c0392b; }
        .shift { background: #ffeaa7; color: #d35400; border-color: #fdcb6e; }

        /* 4. 遮罩层 (菜单 & 错误反馈) */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: white; width: 85%; max-width: 320px; padding: 30px; 
            border-radius: 20px; text-align: center;
        }
        .modal h2 { color: var(--primary); margin-bottom: 15px; }
        .modal p { color: #636e72; margin-bottom: 25px; line-height: 1.5; }
        
        .btn-start {
            background: var(--primary); color: white; padding: 12px 30px; 
            border: none; border-radius: 50px; font-size: 18px; font-weight: bold; width: 100%;
        }

        .err-box {
            background: #f1f2f6; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="overlay active" id="menuOverlay">
        <div class="modal">
            <h2>⚡️ 元素风暴</h2>
            <p>化学反应已就绪。<br>注意：区分大小写，使用专用符号。</p>
            <button class="btn-start" onclick="Game.start()">开始挑战</button>
        </div>
    </div>

    <div class="overlay" id="fbOverlay">
        <div class="modal">
            <h2 style="color:var(--error)">答错了</h2>
            <div class="err-box">
                <div style="font-size:12px; color:#636e72">你的答案</div>
                <div style="font-size:18px; font-family:monospace; margin-bottom:10px; text-decoration:line-through" id="fb-wrong"></div>
                <div style="font-size:12px; color:#636e72">正确答案</div>
                <div style="font-size:24px; font-weight:bold; color:#2d3436" id="fb-right"></div>
            </div>
            <button class="btn-start" onclick="Game.closeFeedback()">继续</button>
        </div>
    </div>

    <div class="hud-bar hidden" id="gameHud">
        <div class="hud-item">关卡 <span class="hud-num" id="hud-stage">S1</span></div>
        <div class="hud-item">进度 <span class="hud-num" id="hud-prog">0/0</span></div>
        <div class="hud-item">得分 <span class="hud-num" id="hud-score">0</span></div>
    </div>

    <div class="game-area hidden" id="gameMain">
        <div class="question-card" id="qCard">
            <div class="q-tag" id="q-tag">Title</div>
            <div class="q-text" id="q-text">H</div>
            
            <div class="q-hint" id="q-hint"></div>

            <div class="input-display" id="inputBox">
                <span id="inputVal"></span><div class="cursor"></div>
            </div>
        </div>
    </div>

    <div class="keyboard hidden" id="gameKb">
        <div class="kb-row">
            <div class="key chem" onclick="KB.tap('⁺')">⁺</div>
            <div class="key chem" onclick="KB.tap('⁻')">⁻</div>
            <div class="key chem" onclick="KB.tap('²')">²</div>
            <div class="key chem" onclick="KB.tap('³')">³</div>
            <div class="key chem" onclick="KB.tap('(')">(</div>
            <div class="key chem" onclick="KB.tap(')')">)</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('Q')">Q</div><div class="key" onclick="KB.tap('W')">W</div>
            <div class="key" onclick="KB.tap('E')">E</div><div class="key" onclick="KB.tap('R')">R</div>
            <div class="key" onclick="KB.tap('T')">T</div><div class="key" onclick="KB.tap('Y')">Y</div>
            <div class="key" onclick="KB.tap('U')">U</div><div class="key" onclick="KB.tap('I')">I</div>
            <div class="key" onclick="KB.tap('O')">O</div><div class="key" onclick="KB.tap('P')">P</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('A')">A</div><div class="key" onclick="KB.tap('S')">S</div>
            <div class="key" onclick="KB.tap('D')">D</div><div class="key" onclick="KB.tap('F')">F</div>
            <div class="key" onclick="KB.tap('G')">G</div><div class="key" onclick="KB.tap('H')">H</div>
            <div class="key" onclick="KB.tap('J')">J</div><div class="key" onclick="KB.tap('K')">K</div>
            <div class="key" onclick="KB.tap('L')">L</div>
        </div>
        <div class="kb-row">
            <div class="key shift" id="btnShift" onclick="KB.toggleShift()">⬆</div>
            <div class="key" onclick="KB.tap('Z')">Z</div><div class="key" onclick="KB.tap('X')">X</div>
            <div class="key" onclick="KB.tap('C')">C</div><div class="key" onclick="KB.tap('V')">V</div>
            <div class="key" onclick="KB.tap('B')">B</div><div class="key" onclick="KB.tap('N')">N</div>
            <div class="key" onclick="KB.tap('M')">M</div>
            <div class="key del" onclick="KB.del()">⌫</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('1')">1</div><div class="key" onclick="KB.tap('2')">2</div>
            <div class="key" onclick="KB.tap('3')">3</div><div class="key" onclick="KB.tap('4')">4</div>
            <div class="key enter" onclick="Game.check()">提交</div>
        </div>
    </div>

<script>
/* ================= 核心数据 ================= */
const DATA = {
    s1: [
        {q:"氢", a:"H"}, {q:"氦", a:"He"}, {q:"碳", a:"C"}, {q:"氮", a:"N"}, {q:"氧", a:"O"},
        {q:"氟", a:"F"}, {q:"氖", a:"Ne"}, {q:"钠", a:"Na"}, {q:"镁", a:"Mg"}, {q:"铝", a:"Al"},
        {q:"硅", a:"Si"}, {q:"磷", a:"P"}, {q:"硫", a:"S"}, {q:"氯", a:"Cl"}, {q:"钾", a:"K"}, 
        {q:"钙", a:"Ca"}, {q:"锰", a:"Mn"}, {q:"铁", a:"Fe"}, {q:"铜", a:"Cu"}, {q:"锌", a:"Zn"}
    ],
    s2: [
        {q:"氢离子", a:"H⁺"}, {q:"钠离子", a:"Na⁺"}, {q:"镁离子", a:"Mg²⁺"}, {q:"铝离子", a:"Al³⁺"},
        {q:"钾离子", a:"K⁺"}, {q:"钙离子", a:"Ca²⁺"}, {q:"铁离子", a:"Fe³⁺"}, {q:"亚铁离子", a:"Fe²⁺"},
        {q:"铜离子", a:"Cu²⁺"}, {q:"银离子", a:"Ag⁺"}, {q:"铵根", a:"NH4⁺"}, 
        {q:"氢氧根", a:"OH⁻"}, {q:"硝酸根", a:"NO3⁻"}, {q:"硫酸根", a:"SO4²⁻"}, {q:"碳酸根", a:"CO3²⁻"}
    ],
    s3: [
        {q:"水", a:"H2O"}, {q:"二氧化碳", a:"CO2"}, {q:"氯化钠", a:"NaCl"}, {q:"氧化镁", a:"MgO"},
        {q:"五氧化二磷", a:"P2O5"}, {q:"四氧化三铁", a:"Fe3O4"}, {q:"氯酸钾", a:"KClO3"},
        {q:"硫酸铜", a:"CuSO4"}, {q:"碳酸钙", a:"CaCO3"}, {q:"氢氧化钙", a:"Ca(OH)2"},
        {q:"硫酸铝", a:"Al2(SO4)3"}
    ]
};

const LEVELS = [
    { id: 's1', name: 'S1 元素', target: 8, hint: "提示：注意大小写 (如 Na)" },
    { id: 's2', name: 'S2 离子', target: 8, hint: "提示：记得带电荷 (如 Na⁺)" },
    { id: 's3', name: 'S3 物质', target: 8, hint: "提示：原子团若有角标需加括号" }
];

/* ================= 游戏逻辑 ================= */
const Game = {
    lvlIdx: 0,
    qIdx: 0,
    score: 0,
    currQ: null,

    // 点击主菜单“开始挑战”
    start() {
        // 1. 隐藏菜单
        document.getElementById('menuOverlay').classList.remove('active');
        
        // 2. 显示游戏区域 (移除 hidden 类)
        document.getElementById('gameHud').classList.remove('hidden');
        document.getElementById('gameMain').classList.remove('hidden');
        document.getElementById('gameKb').classList.remove('hidden');

        // 3. 初始化数据
        this.lvlIdx = 0;
        this.score = 0;
        this.startLevel();
    },

    startLevel() {
        this.qIdx = 0;
        this.nextQuestion();
    },

    nextQuestion() {
        const lvl = LEVELS[this.lvlIdx];

        // 检查过关
        if (this.qIdx >= lvl.target) {
            // PDF P1: 无缝进入下一关
            if (this.lvlIdx < LEVELS.length - 1) {
                this.lvlIdx++;
                this.startLevel();
            } else {
                alert("恭喜通关！");
                location.reload();
            }
            return;
        }

        // 随机出题
        const pool = DATA[lvl.id];
        this.currQ = pool[Math.floor(Math.random() * pool.length)];

        // 更新界面 (HUD & 题目)
        document.getElementById('hud-stage').innerText = lvl.name;
        // 关键修复：确保进度条更新
        document.getElementById('hud-prog').innerText = (this.qIdx + 1) + " / " + lvl.target;
        document.getElementById('hud-score').innerText = this.score;

        document.getElementById('q-tag').innerText = "题目 " + (this.qIdx + 1);
        document.getElementById('q-text').innerText = this.currQ.q;
        
        // 清空输入
        document.getElementById('inputVal').innerText = "";
        KB.reset();

        // PDF P2: 智能提示 (仅第1题显示)
        const hintEl = document.getElementById('q-hint');
        if (this.qIdx === 0) {
            hintEl.innerText = lvl.hint;
            hintEl.style.opacity = 1;
        } else {
            hintEl.style.opacity = 0;
        }
    },

    check() {
        const input = document.getElementById('inputVal').innerText;
        if (!input) return;

        if (input === this.currQ.a) {
            // 答对：特效 + 加分 + 下一题
            this.score += 10;
            this.qIdx++;
            
            // 简单 Pop 特效
            const card = document.getElementById('qCard');
            card.classList.remove('pop');
            void card.offsetWidth; // 触发重绘
            card.classList.add('pop');
            
            this.nextQuestion();
        } else {
            // 答错：显示反馈遮罩
            document.getElementById('fb-wrong').innerText = input;
            document.getElementById('fb-right').innerText = this.currQ.a;
            document.getElementById('fbOverlay').classList.add('active');
        }
    },

    closeFeedback() {
        // 关闭遮罩，换新题
        document.getElementById('fbOverlay').classList.remove('active');
        this.nextQuestion();
    }
};

/* ================= 键盘逻辑 ================= */
const KB = {
    isShift: true,
    tap(char) {
        let c = char;
        // 大小写处理
        if (/[a-z]/i.test(c) && c.length === 1) {
            c = this.isShift ? c.toUpperCase() : c.toLowerCase();
            if (this.isShift) this.toggleShift();
        }
        
        const box = document.getElementById('inputVal');
        box.innerText += c;

        // 高亮反馈
        const wrap = document.getElementById('inputBox');
        wrap.classList.add('active');
        setTimeout(() => wrap.classList.remove('active'), 100);
    },
    del() {
        const box = document.getElementById('inputVal');
        box.innerText = box.innerText.slice(0, -1);
        if (box.innerText.length === 0) { this.isShift = true; this.render(); }
    },
    toggleShift() { this.isShift = !this.isShift; this.render(); },
    reset() { this.isShift = true; this.render(); },
    render() {
        const btn = document.getElementById('btnShift');
        if (this.isShift) btn.classList.add('active'); else btn.classList.remove('active');
        
        document.querySelectorAll('.key').forEach(k => {
            const t = k.innerText;
            if (t.length === 1 && /[a-z]/i.test(t)) {
                k.innerText = this.isShift ? t.toUpperCase() : t.toLowerCase();
            }
        });
    }
};

// 物理键盘监听
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        if (document.getElementById('fbOverlay').classList.contains('active')) Game.closeFeedback();
        else if (!document.getElementById('menuOverlay').classList.contains('active')) Game.check();
    } else if (e.key === 'Backspace') {
        KB.del();
    } else if (e.key.length === 1) {
        KB.tap(e.key);
    }
});
</script>
</body>
</html>
