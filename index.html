<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>元素风暴：最终复仇版</title>
    <style>
        /* =========================================
           1. 视觉核心 (基于你最爱的原版配色)
           ========================================= */
        :root {
            --primary: #4834d4; 
            --primary-light: #686de0;
            --accent: #00d2d3;
            --success: #6ab04c; 
            --error: #eb4d4b;
            --bg-normal: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            /* BOSS战专属红黑氛围 */
            --bg-boss: radial-gradient(circle at center, #2d3436 0%, #000000 100%);
            --glass: rgba(255, 255, 255, 0.9);
            --glass-boss: rgba(30, 30, 30, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-normal);
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
            transition: background 1.5s ease; /* 背景平滑切换 */
        }

        /* 3A特效：屏幕震动类 */
        .shake-screen { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }

        /* BOSS模式状态 */
        body.boss-mode { background: var(--bg-boss); }
        body.boss-mode .hud-box, body.boss-mode .keyboard-panel { background: var(--glass-boss); color: white; border: 1px solid var(--error); }
        body.boss-mode .key { background: #444; color: white; box-shadow: 0 4px 0 #222; }
        body.boss-mode .key:active { box-shadow: none; transform: translateY(4px); }
        body.boss-mode .q-text { color: var(--error); text-shadow: 0 0 15px var(--error); }

        /* HUD 仪表盘 */
        .hud-container {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
            z-index: 20; height: 70px;
        }
        .hud-box {
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 5px 15px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.5s; min-width: 70px;
        }
        .bar-frame { width: 100px; height: 8px; background: rgba(0,0,0,0.1); border-radius: 4px; margin-top: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        
        /* 游戏主舞台 */
        .arena {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            width: 100%; position: relative; z-index: 10;
        }
        
        .q-card {
            background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
            width: 90%; max-width: 500px;
            padding: 20px; border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transition: transform 0.3s, background 0.5s;
        }
        
        .q-tag { 
            display: inline-block; background: #dfe6e9; color: #636e72; 
            padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; 
        }
        .q-text { font-size: 42px; font-weight: 900; color: #2d3436; margin: 10px 0; min-height: 60px; }
        
        /* === PDF P2 核心需求：智能提示 === */
        .q-hint { 
            height: 20px; font-size: 13px; color: #b2bec3; margin-bottom: 15px; 
            transition: opacity 0.3s; opacity: 1; 
        }

        /* 模拟输入框 */
        .input-box {
            background: #f1f2f6; border-radius: 16px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold; color: #2d3436; font-family: Consolas, monospace;
            border: 2px solid transparent; transition: all 0.2s;
            position: relative; overflow: hidden;
        }
        .input-box.active { background: white; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(72, 52, 212, 0.2); }
        .cursor { width: 2px; height: 30px; background: var(--primary); margin-left: 2px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 虚拟键盘区 */
        .keyboard-panel {
            width: 100%; max-width: 800px;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0; padding: 10px 5px 25px 5px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            z-index: 100; transition: all 0.5s;
        }

        .kb-row { display: flex; justify-content: center; margin-bottom: 6px; gap: 5px; }
        .key {
            flex: 1; height: 48px; max-width: 50px;
            background: #fff; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: #2d3436;
            box-shadow: 0 4px 0 #b2bec3; cursor: pointer;
            transition: all 0.1s;
        }
        .key:active { transform: translateY(4px); box-shadow: none; }
        
        /* 特殊键位颜色 */
        .key.chem { background: #e3f2fd; color: #0984e3; box-shadow: 0 4px 0 #74b9ff; font-size: 16px; }
        .key.enter { flex: 2; max-width: 100px; background: var(--success); color: white; box-shadow: 0 4px 0 #009476; }
        .key.del { background: var(--error); color: white; box-shadow: 0 4px 0 #c0392b; }
        .key.shift { background: #ffeaa7; color: #d35400; box-shadow: 0 4px 0 #fdcb6e; }
        .key.shift.active { background: #fdcb6e; color: white; transform: translateY(2px); box-shadow: 0 2px 0 #e1b12c; }

        /* 粒子特效层 */
        #vfx-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; animation: explode 0.6s forwards; }
        @keyframes explode { 0% { transform: scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }

        /* 模态框 (只在失败或通关显示，关卡间不显示) */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal.visible { opacity: 1; pointer-events: auto; }
        .modal-card { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 80%; max-width: 300px; }
        .btn-restart { 
            background: var(--primary); color: white; padding: 10px 30px; 
            border: none; border-radius: 50px; font-size: 18px; margin-top: 20px; cursor: pointer; 
        }

    </style>
</head>
<body>

    <div id="vfx-layer"></div>

    <div class="hud-container">
        <div class="hud-box">
            <span style="font-size:10px; opacity:0.6">关卡</span>
            <strong id="stage-name" style="font-size:14px">S1 元素</strong>
        </div>
        <div class="hud-box" style="flex:1; margin:0 10px;">
            <span style="font-size:10px; opacity:0.6">任务进度</span>
            <div class="bar-frame" style="width:100%"><div class="bar-fill" id="prog-bar"></div></div>
        </div>
        <div class="hud-box">
            <span style="font-size:10px; opacity:0.6">生命值</span>
            <div style="color:var(--error); letter-spacing:2px" id="lives-display">❤❤❤</div>
        </div>
    </div>

    <div class="arena">
        <div class="q-card" id="card-body">
            <div class="q-tag" id="q-tag">题目</div>
            <div class="q-text" id="q-text">Ready?</div>
            
            <div class="q-hint" id="q-hint">提示：注意大小写</div>

            <div class="input-box" id="input-slot">
                <span id="input-val"></span><div class="cursor"></div>
            </div>
        </div>
    </div>

    <div class="keyboard-panel">
        <div class="kb-row">
            <div class="key chem" onclick="KB.tap('⁺')">⁺</div>
            <div class="key chem" onclick="KB.tap('⁻')">⁻</div>
            <div class="key chem" onclick="KB.tap('²')">²</div>
            <div class="key chem" onclick="KB.tap('³')">³</div>
            <div class="key chem" onclick="KB.tap('(')">(</div> <div class="key chem" onclick="KB.tap(')')">)</div> </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('Q')">Q</div><div class="key" onclick="KB.tap('W')">W</div>
            <div class="key" onclick="KB.tap('E')">E</div><div class="key" onclick="KB.tap('R')">R</div>
            <div class="key" onclick="KB.tap('T')">T</div><div class="key" onclick="KB.tap('Y')">Y</div>
            <div class="key" onclick="KB.tap('U')">U</div><div class="key" onclick="KB.tap('I')">I</div>
            <div class="key" onclick="KB.tap('O')">O</div><div class="key" onclick="KB.tap('P')">P</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('A')">A</div><div class="key" onclick="KB.tap('S')">S</div>
            <div class="key" onclick="KB.tap('D')">D</div><div class="key" onclick="KB.tap('F')">F</div>
            <div class="key" onclick="KB.tap('G')">G</div><div class="key" onclick="KB.tap('H')">H</div>
            <div class="key" onclick="KB.tap('J')">J</div><div class="key" onclick="KB.tap('K')">K</div>
            <div class="key" onclick="KB.tap('L')">L</div>
        </div>
        <div class="kb-row">
            <div class="key shift" id="btn-shift" onclick="KB.toggleShift()">⬆</div>
            <div class="key" onclick="KB.tap('Z')">Z</div><div class="key" onclick="KB.tap('X')">X</div>
            <div class="key" onclick="KB.tap('C')">C</div><div class="key" onclick="KB.tap('V')">V</div>
            <div class="key" onclick="KB.tap('B')">B</div><div class="key" onclick="KB.tap('N')">N</div>
            <div class="key" onclick="KB.tap('M')">M</div>
            <div class="key del" onclick="KB.del()">⌫</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="KB.tap('1')">1</div><div class="key" onclick="KB.tap('2')">2</div>
            <div class="key" onclick="KB.tap('3')">3</div><div class="key" onclick="KB.tap('4')">4</div>
            <div class="key enter" onclick="Engine.check()">提交 (Enter)</div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-card">
            <h2 id="modal-title" style="margin-bottom:10px; color:#2d3436;">闯关失败</h2>
            <p id="modal-msg" style="color:#636e72;">再接再厉！</p>
            <button class="btn-restart" onclick="Engine.restart()">重新开始</button>
        </div>
    </div>

<script>
/* ================= 题库数据 (精简版) ================= */
const DATA = {
    // S1: 元素符号
    elements: [
        {q:"氢", a:"H"}, {q:"氦", a:"He"}, {q:"碳", a:"C"}, {q:"氮", a:"N"}, {q:"氧", a:"O"},
        {q:"钠", a:"Na"}, {q:"镁", a:"Mg"}, {q:"铝", a:"Al"}, {q:"硅", a:"Si"}, {q:"磷", a:"P"},
        {q:"硫", a:"S"}, {q:"氯", a:"Cl"}, {q:"钾", a:"K"}, {q:"钙", a:"Ca"}, {q:"铁", a:"Fe"},
        {q:"铜", a:"Cu"}, {q:"锌", a:"Zn"}, {q:"银", a:"Ag"}
    ],
    // S2: 离子符号
    ions: [
        {q:"氢离子", a:"H⁺"}, {q:"钠离子", a:"Na⁺"}, {q:"镁离子", a:"Mg²⁺"}, {q:"铝离子", a:"Al³⁺"},
        {q:"氯离子", a:"Cl⁻"}, {q:"氧离子", a:"O²⁻"}, {q:"硫离子", a:"S²⁻"}, {q:"氢氧根", a:"OH⁻"},
        {q:"硝酸根", a:"NO3⁻"}, {q:"硫酸根", a:"SO4²⁻"}, {q:"碳酸根", a:"CO3²⁻"}, {q:"铵根", a:"NH4⁺"}
    ],
    // S3: 化学式 (加括号测试)
    formulas: [
        {q:"水", a:"H2O"}, {q:"二氧化碳", a:"CO2"}, {q:"氯化钠", a:"NaCl"}, {q:"氧化镁", a:"MgO"},
        {q:"硫酸铜", a:"CuSO4"}, {q:"碳酸钙", a:"CaCO3"}, {q:"氢氧化钙", a:"Ca(OH)2"}, {q:"硫酸铝", a:"Al2(SO4)3"}
    ]
};

/* ================= 游戏逻辑核心 ================= */
const Engine = {
    lvlIdx: 0,
    qIdx: 0,
    lives: 3,
    currData: null,
    bossHp: 0,

    // 关卡配置
    levels: [
        { name: "S1 元素觉醒", type: "el", target: 8, hint: "提示：注意大小写 (如 Na)" },
        { name: "S2 离子风暴", type: "ion", target: 8, hint: "提示：记得右上角电荷 (键盘首行)" },
        { name: "S3 物质构建", type: "form", target: 8, hint: "提示：原子团需加括号" },
        { name: "BOSS 混沌试炼", type: "boss", target: 99, hp: 5, hint: "警告：全类型混合攻击！" }
    ],

    init() {
        this.lvlIdx = 0;
        this.lives = 3;
        this.startLevel();
    },

    // PDF P1 核心：这里不再弹窗，直接开始
    startLevel() {
        const config = this.levels[this.lvlIdx];
        this.qIdx = 0;
        
        // 视觉状态切换
        document.body.className = (config.type === 'boss') ? 'boss-mode' : '';
        if(config.type === 'boss') this.bossHp = config.hp;

        // UI更新
        document.getElementById('stage-name').innerText = config.name;
        this.updateHUD();
        this.nextQ();
    },

    nextQ() {
        const config = this.levels[this.lvlIdx];
        
        // 判断过关
        let isDone = false;
        if(config.type === 'boss') isDone = (this.bossHp <= 0);
        else isDone = (this.qIdx >= config.target);

        if(isDone) {
            if(this.lvlIdx < this.levels.length - 1) {
                // PDF P1 核心：直接无缝进下一关
                this.lvlIdx++;
                this.startLevel(); 
            } else {
                this.gameOver(true); // 通关
            }
            return;
        }

        // 生成题目
        let pool = [];
        if(config.type === 'el') pool = DATA.elements;
        else if(config.type === 'ion') pool = DATA.ions;
        else if(config.type === 'form') pool = DATA.formulas;
        else { // Boss混合
            pool = [...DATA.elements, ...DATA.ions, ...DATA.formulas];
        }
        
        const item = pool[Math.floor(Math.random() * pool.length)];
        this.currData = item;

        // 渲染题目
        document.getElementById('q-tag').innerText = (config.type==='boss'?'BOSS':'当前') + "题目";
        document.getElementById('q-text').innerText = item.q;
        document.getElementById('input-val').innerText = "";
        KB.isShift = true; KB.render();

        // === PDF P2 核心逻辑：Hint 仅在第1题 (qIdx=0) 显示 ===
        const hintEl = document.getElementById('q-hint');
        if(this.qIdx === 0) {
            hintEl.innerText = config.hint;
            hintEl.style.opacity = 1;
        } else {
            hintEl.style.opacity = 0; // 隐形但占位，防止界面跳动
        }

        this.updateHUD();
    },

    check() {
        const input = document.getElementById('input-val').innerText;
        if(!input) return;

        if(input === this.currData.a) {
            // 正确：3A特效 (粒子 + 音效模拟)
            this.spawnParticles(true);
            const config = this.levels[this.lvlIdx];
            
            if(config.type === 'boss') this.bossHp--;
            else this.qIdx++;

            setTimeout(() => this.nextQ(), 500);
        } else {
            // 错误：3A特效 (震动 + 红粒子)
            this.spawnParticles(false);
            document.body.classList.remove('shake-screen');
            void document.body.offsetWidth; // 触发重绘
            document.body.classList.add('shake-screen');

            this.lives--;
            this.updateHUD();
            if(this.lives <= 0) this.gameOver(false);
        }
    },

    updateHUD() {
        const config = this.levels[this.lvlIdx];
        // 生命值
        document.getElementById('lives-display').innerText = "❤".repeat(this.lives);
        
        // 进度条
        const bar = document.getElementById('prog-bar');
        if(config.type === 'boss') {
            const pct = (this.bossHp / config.hp) * 100;
            bar.style.width = pct + "%";
            bar.style.background = "#eb4d4b"; // Boss血条红
        } else {
            const pct = (this.qIdx / config.target) * 100;
            bar.style.width = pct + "%";
            bar.style.background = "#4834d4";
        }
    },

    gameOver(win) {
        const m = document.getElementById('modal');
        const title = document.getElementById('modal-title');
        const msg = document.getElementById('modal-msg');
        
        m.classList.add('visible');
        if(win) {
            title.innerText = "传说达成！";
            title.style.color = "#00b894";
            msg.innerText = "你已征服所有元素！";
        } else {
            title.innerText = "任务失败";
            title.style.color = "#d63031";
            msg.innerText = `正确答案是：${this.currData.a}`;
        }
    },

    restart() {
        document.getElementById('modal').classList.remove('visible');
        this.init();
    },

    spawnParticles(success) {
        const rect = document.getElementById('input-slot').getBoundingClientRect();
        const color = success ? '#00b894' : '#d63031';
        const container = document.getElementById('vfx-layer');
        
        for(let i=0; i<20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.backgroundColor = color;
            p.style.width = (Math.random()*8+4) + 'px';
            p.style.height = p.style.width;
            
            // 初始位置
            p.style.left = (rect.left + rect.width/2) + 'px';
            p.style.top = (rect.top + rect.height/2) + 'px';
            
            // 爆炸方向
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 100 + 50;
            p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
            p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
            
            container.appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
    }
};

/* ================= 键盘控制 ================= */
const KB = {
    isShift: true,
    tap(char) {
        let c = char;
        // 字母大小写处理
        if(/[a-z]/i.test(c) && c.length === 1) {
            c = this.isShift ? c.toUpperCase() : c.toLowerCase();
            if(this.isShift) this.toggleShift(); // 首字母大写后自动切回小写
        }
        
        const box = document.getElementById('input-val');
        box.innerText += c;
        
        // 简单的输入反馈
        const slot = document.getElementById('input-slot');
        slot.classList.add('active');
        setTimeout(() => slot.classList.remove('active'), 100);
    },
    del() {
        const box = document.getElementById('input-val');
        box.innerText = box.innerText.slice(0, -1);
        if(box.innerText.length === 0) {
            this.isShift = true; this.render();
        }
    },
    toggleShift() {
        this.isShift = !this.isShift;
        this.render();
    },
    render() {
        const btn = document.getElementById('btn-shift');
        if(this.isShift) btn.classList.add('active'); else btn.classList.remove('active');
        
        document.querySelectorAll('.key').forEach(k => {
            const txt = k.innerText;
            if(txt.length === 1 && /[a-z]/i.test(txt)) {
                k.innerText = this.isShift ? txt.toUpperCase() : txt.toLowerCase();
            }
        });
    }
};

// 物理键盘支持
document.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') Engine.check();
    else if(e.key === 'Backspace') KB.del();
    else if(e.key.length === 1) KB.tap(e.key);
});

// 启动
Engine.init();

</script>
</body>
</html>
